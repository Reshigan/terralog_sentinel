<style>
:root {
  color-scheme: light dark;
  /* The neutral ramp is GENERATED, not listed: one hue knob, one chroma knob, and a
     lightness per rung. A domain turns the two knobs and the whole page changes
     material (see the dom-* blocks); dark mode moves the lightness rungs only. A
     hex ramp could do neither without forking the sheet. Chroma is scaled per rung
     because a tint that reads as "barely there" on paper reads as a colour cast on
     ink at the same chroma. */
  --n-h: 250; --n-c: 0.012;
  /* --l-paper has a floor, not a free choice: codegen.marketing.ts lifts its own
     landing focus ring to exactly 3:1 against #f4f6f8, and login.html reuses that
     ring on THIS paper. Any darker and the shared ring drops under AA. */
  --l-paper: 97.4%; --l-surface: 100%; --l-surface-2: 98.3%; --l-line: 91.5%;
  /* --l-ink-3 is 54%, not the 61% it read for most of this file's life: the muted
     rung is TEXT (#drawer-close), and at 61% it came out 3.73-3.79:1 on --surface
     across 12 of 13 light ramps against a 4.5:1 floor. The rung was informally
     "reserved for large-only glyphs", but its one reader is 20.2-21.6px at normal
     weight and large text starts at 24px, so no exemption applied. 54% is the
     measured value: it is the first half-point that keeps the whole set at or above
     the 4.90:1 tightest pair this file claims, and it clears 4.5:1 on --paper and
     --surface-2 too, so the next rule to reach for the rung is safe wherever it
     paints. (57%, the first guess, lands at 4.41:1 and still fails.) Dark keeps its
     own rung: 62% on the dark --surface was already 5.03:1. */
  --l-ink: 20%; --l-ink-2: 45.5%; --l-ink-3: 54%;
  --l-rail: 19%; --l-rail-2: 25.5%; --l-rail-ink: 87%; --l-rail-ink-2: 69%;
  /* Hex twins, then the live ramp. codegen.auth.ts lifts this whole block verbatim
     into login.html and derives its button/focus pairs from --paper/--surface with a
     regex that only reads literal hex; without a twin it silently falls back to a
     hand-copied colour and proves contrast against a ground the page never paints.
     The later oklch declaration is what actually renders \u2014 the twin is the same
     colour written twice, and codegen.styles.test.ts fails if the two drift. */
  --paper: #f1f7fe; --surface: #fdffff;
  --paper: oklch(var(--l-paper) var(--n-c) var(--n-h));
  --surface: oklch(var(--l-surface) calc(var(--n-c) * .35) var(--n-h));
  --surface-2: oklch(var(--l-surface-2) calc(var(--n-c) * .8) var(--n-h));
  --line: oklch(var(--l-line) calc(var(--n-c) * 1.2) var(--n-h));
  --ink: oklch(var(--l-ink) calc(var(--n-c) * 1.6) var(--n-h));
  --ink-2: oklch(var(--l-ink-2) calc(var(--n-c) * 1.3) var(--n-h));
  --ink-3: oklch(var(--l-ink-3) calc(var(--n-c) * 1.1) var(--n-h));
  --rail-ink: oklch(var(--l-rail-ink) calc(var(--n-c) * .9) var(--n-h));
  --rail-ink-2: oklch(var(--l-rail-ink-2) calc(var(--n-c) * .9) var(--n-h));
  --line-rail: oklch(100% 0 0 / .09);
  --rail: oklch(var(--l-rail) calc(var(--n-c) * 2.4) var(--n-h));
  --rail-2: oklch(var(--l-rail-2) calc(var(--n-c) * 2.2) var(--n-h));
  /* Identity tokens \u2014 the brand owns these (brandCss overrides them one sheet
     later). Nothing in a dom-* block may touch them, or the approved palette stops
     being the product's identity. */
  --accent: oklch(52% 0.08 168); --accent-ink: oklch(100% 0 0);
  /* Signal colours. Every one is a self-contained pair (ink on its own -soft
     ground), so a pill is legible whatever the surface underneath is doing. */
  --green: oklch(47% .12 155); --amber: oklch(50% .125 60);
  --coral: #b6143f; /* hex twin \u2014 see --paper above; login.html proves its error text on this */
  --coral: oklch(50% .19 15); --coral-ink: oklch(100% 0 0); --slate: oklch(46% .03 255);
  /* The accent/signal mixes. This :root copy is the one login.html lifts; the body
     copy below is the one a domain skin can move. See SOFT_MIXES for why both. */
  --accent-soft: color-mix(in srgb, var(--accent) 18%, var(--surface));
  --focus: color-mix(in srgb, var(--accent) 35%, var(--ink));
  --green-soft: color-mix(in srgb, var(--green) 14%, var(--surface));
  --amber-soft: color-mix(in srgb, var(--amber) 14%, var(--surface));
  --coral-soft: color-mix(in srgb, var(--coral) 14%, var(--surface));
  --slate-soft: color-mix(in srgb, var(--slate) 14%, var(--surface));
  /* Type scale: fixed rem, one ~1.15 ratio ladder. Not fluid \u2014 product UI that
     resizes with the window makes a table jump between two monitors. --text-scale is
     the one knob a domain turns to make the whole product read denser or larger.
     Display type is deliberately NOT on the ladder: the hero owns it (layout.ts),
     because the masthead is the only element allowed to track the viewport.
     Two multipliers, two owners: --text-scale is the domain's reading size, --dense
     is the archetype's density (archetypeCss sets it). Absolute sizes in either
     place deleted the other one's decision. */
  --text-scale: 1; --dense: 1;
  --text-xs: calc(.74rem * var(--text-scale) * var(--dense));
  --text-sm: calc(.82rem * var(--text-scale) * var(--dense));
  --text-base: calc(.94rem * var(--text-scale) * var(--dense));
  --text-md: calc(1.06rem * var(--text-scale) * var(--dense));
  --text-lg: calc(1.26rem * var(--text-scale) * var(--dense));
  --text-xl: calc(1.9rem * var(--text-scale) * var(--dense));
  --text-display: clamp(1.6rem, 1.15rem + 1.5vw, 2.4rem);
  --track-tight: -0.02em; --track-wide: .1em;
  /* Column heads and rail labels: a domain can drop the tracked-caps convention for
     sentence case, which changes the voice of every table on the page. */
  --label-case: uppercase; --label-track: var(--track-wide);
  /* Numerals. Mono tabular by default (columns of figures must align); a domain
     whose numbers are counts rather than measurements switches to the body face. */
  --font-num: var(--font-mono);
  --radius: 16px; --radius-sm: 10px; --radius-pill: 999px; --nav-w: 15.5rem;
  /* Row rhythm \u2014 one token, because a table row, a skeleton row and a detail row all
     have to breathe the same or the placeholder does not match what lands. */
  --row-y: 13px;
  --space-1: 4px; --space-2: 8px; --space-3: 16px; --space-4: 24px; --space-5: 40px;
  /* Elevation is a scale too, and it is tinted with the page's own hue rather than
     neutral black \u2014 a grey shadow on a tinted ground reads as dirt. */
  --shadow: 0 1px 2px oklch(20% .04 var(--n-h) / .05), 0 4px 16px oklch(20% .04 var(--n-h) / .06);
  --shadow-lift: 0 14px 34px oklch(20% .04 var(--n-h) / .12);
  --shadow-drawer: -12px 0 40px oklch(20% .04 var(--n-h) / .14);
  --shadow-toast: 0 8px 24px oklch(20% .04 var(--n-h) / .25);
  --scrim: oklch(20% .03 var(--n-h) / .42);
  --font-display: "Bricolage Grotesque", system-ui, -apple-system, sans-serif;
  --font-body: "Hanken Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  /* Semantic stacking scale \u2014 every layered surface in the shell picks a rung
     here instead of inventing its own number, so two floating layers can never
     land on the same z by accident. dropdown/tooltip have no consumer yet
     (no such component exists in the DOM today) but the rung is reserved. */
  --z-dropdown: 20; --z-sticky: 30; --z-backdrop: 40; --z-drawer: 50; --z-toast: 60; --z-tooltip: 70;
  /* Motion scale. 1-4 are interaction (state changed, and the eye should be told
     without being delayed); 5 is an arrival; ambient is the one-shot atmosphere the
     hero earns. Nothing in this file animates on a loop. */
  --dur-1: 120ms; --dur-2: 180ms; --dur-3: 240ms; --dur-4: 320ms; --dur-5: 560ms;
  /* The one ambient arrival (the hero aura) keeps a literal 1.1s: it is longer than
     any rung on the interaction scale by design, and codegen.test.ts asserts that
     exact declaration as the "arrives once, never loops" contract. */
  /* Two canonical curves, both exponential ease-out: fast start, long soft settle,
     never overshoots (no bounce/elastic anywhere in this file). -expo for entrances
     and travel, -quart for short state changes where expo reads as sluggish. */
  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
}
/* Dark is a first-class theme, not an inversion: the lightness rungs get their own
   values and the signal colours are re-picked for contrast on dark (the light greens
   and corals go muddy). Only tokens move \u2014 every rule below stays theme-agnostic,
   and every domain skin keeps working because it only owns hue, chroma and rhythm. */
@media (prefers-color-scheme: dark) {
  :root {
    /* Hex twins for the lifted block, same rule as the light one above. They must be
       re-stated here AND followed by the ramp again: this block is later in the
       cascade, so a bare hex would win over the light block's oklch and freeze the
       dark theme at one hue for every domain. */
    --paper: #05090d; --surface: #131517; --coral: #ff7c8a;
    --l-paper: 13.5%; --l-surface: 19.5%; --l-surface-2: 23%; --l-line: 27.5%;
    --l-ink: 94%; --l-ink-2: 77%; --l-ink-3: 62%;
    --l-rail: 9%; --l-rail-2: 21%; --l-rail-ink: 88%; --l-rail-ink-2: 68%;
    --paper: oklch(var(--l-paper) var(--n-c) var(--n-h));
    --surface: oklch(var(--l-surface) calc(var(--n-c) * .35) var(--n-h));
    --line-rail: oklch(100% 0 0 / .07);
    --green: oklch(80% .16 160); --amber: oklch(83% .14 78); --slate: oklch(72% .03 255);
    /* --coral flips from a dark ink-red to a bright coral in dark mode \u2014 white
       text on it (toast-err) would drop to ~2.7:1, so its ink flips too. */
    --coral: oklch(74% .16 15); --coral-ink: oklch(13.5% 0 0);
    --shadow: 0 1px 2px oklch(0% 0 0 / .5), 0 10px 30px oklch(0% 0 0 / .42);
    --shadow-lift: 0 14px 34px oklch(0% 0 0 / .5);
    --shadow-drawer: -12px 0 40px oklch(0% 0 0 / .5);
    --shadow-toast: 0 8px 24px oklch(0% 0 0 / .5);
    --scrim: oklch(4% .02 var(--n-h) / .62);
  }
}
/* The derived ramps AGAIN, on body \u2014 the rule that makes a domain skin do anything.
   A custom property is substituted at computed-value time on the element that
   DECLARES it, so the :root copies above resolve against :root's own --n-h / --n-c /
   --text-scale and only the FINISHED colour inherits down. The dom-* blocks turn
   those knobs on body, which is past the point where the derivation happened: for
   most of this file's life all 12 skins rendered one grey and one type size in a real
   browser, while every text-model assertion in codegen.styles.test.ts (and two
   hand-written 12-skin tables) reported 13 ramps nothing ever painted. Measured in
   Chrome, not reasoned about \u2014 codegen.styles.test.ts now launches one.

   Why a second copy rather than :root, body: codegen.auth.ts lifts this sheet's
   :root blocks VERBATIM into login.html with a /:root\s*\{[^}]*\}/ regex, and
   login.html carries no dom-* class, so the :root copy has to stay and has to keep
   that exact shape. One source (NEUTRAL_RAMP / TYPE_RAMP) means the two cannot drift.

   Cascade: body is (0,0,1), so body.dom-x at (0,1,1) still wins, order-independent.
   Themes: the expressions are scheme-agnostic \u2014 only the --l-* rungs they read move,
   and body inherits whichever set the dark @media put on :root (or, for a dark-first
   skin, the ones DARK_FIRST declares in the same body.dom-x block). */
body { --paper: oklch(var(--l-paper) var(--n-c) var(--n-h));
  --surface: oklch(var(--l-surface) calc(var(--n-c) * .35) var(--n-h));
  --surface-2: oklch(var(--l-surface-2) calc(var(--n-c) * .8) var(--n-h));
  --line: oklch(var(--l-line) calc(var(--n-c) * 1.2) var(--n-h));
  --ink: oklch(var(--l-ink) calc(var(--n-c) * 1.6) var(--n-h));
  --ink-2: oklch(var(--l-ink-2) calc(var(--n-c) * 1.3) var(--n-h));
  --ink-3: oklch(var(--l-ink-3) calc(var(--n-c) * 1.1) var(--n-h));
  --rail-ink: oklch(var(--l-rail-ink) calc(var(--n-c) * .9) var(--n-h));
  --rail-ink-2: oklch(var(--l-rail-ink-2) calc(var(--n-c) * .9) var(--n-h));
  --accent-soft: color-mix(in srgb, var(--accent) 18%, var(--surface));
  --focus: color-mix(in srgb, var(--accent) 35%, var(--ink));
  --green-soft: color-mix(in srgb, var(--green) 14%, var(--surface));
  --amber-soft: color-mix(in srgb, var(--amber) 14%, var(--surface));
  --coral-soft: color-mix(in srgb, var(--coral) 14%, var(--surface));
  --slate-soft: color-mix(in srgb, var(--slate) 14%, var(--surface));
  --text-xs: calc(.74rem * var(--text-scale) * var(--dense));
  --text-sm: calc(.82rem * var(--text-scale) * var(--dense));
  --text-base: calc(.94rem * var(--text-scale) * var(--dense));
  --text-md: calc(1.06rem * var(--text-scale) * var(--dense));
  --text-lg: calc(1.26rem * var(--text-scale) * var(--dense));
  --text-xl: calc(1.9rem * var(--text-scale) * var(--dense)); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
.tabular { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
body { font: var(--text-base)/1.55 var(--font-body); background: var(--paper); color: var(--ink);
  display: grid; grid-template-columns: var(--nav-w) 1fr; grid-template-rows: 100dvh; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--font-display); letter-spacing: var(--track-tight); }
/* The gradient ends on the rail's own colour mixed toward black, never a fixed
   navy: the brand owns --rail, and a hardcoded stop made every rail read blue. */
aside { background: linear-gradient(180deg, var(--rail) 0%, color-mix(in srgb, var(--rail) 78%, #000) 100%); color: var(--rail-ink);
  --focus: color-mix(in srgb, var(--accent) 35%, var(--rail-ink));
  padding: var(--space-4) var(--space-3); display: flex; flex-direction: column; gap: var(--space-4); overflow-y: auto; }
.brand { font-family: var(--font-display); font-size: var(--text-md); font-weight: 750; letter-spacing: var(--track-tight);
  color: #fff; padding: var(--space-1) var(--space-2); display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 22px; height: 22px; border-radius: 7px; flex: none; overflow: hidden;
  background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 45%, #fff));
  display: inline-block; box-shadow: 0 2px 10px color-mix(in srgb, var(--accent) 45%, transparent); }
.brand-mark svg { width: 100%; height: 100%; display: block; }
/* The wordmark is its own element so it can be TRUNCATED. As a bare text node it
   was an anonymous flex item, and text-overflow on the flex container never applied \u2014
   which is how a long product name pushed the nav out of a floating dock. */
.brand-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-tag { font-size: var(--text-xs); line-height: 1.35; color: var(--rail-ink-2); padding: 0 var(--space-2); max-width: 15rem; }
.rail-label { font-size: var(--text-xs); font-weight: 600; text-transform: var(--label-case); letter-spacing: var(--label-track); color: var(--rail-ink-2); padding: 0 var(--space-2); }
#nav { display: flex; flex-direction: column; gap: 2px; }
.nav-item { text-align: left; background: none; border: 0; color: var(--rail-ink); font: inherit; font-weight: 500;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm); cursor: pointer; min-height: 40px;
  display: flex; align-items: center; gap: 9px; transition: background var(--dur-1) var(--ease-out-quart), color var(--dur-1) var(--ease-out-quart); }
.nav-item:hover { background: var(--rail-2); color: #fff; }
.nav-item.active { background: var(--rail-2); color: #fff; }
/* Custom domain glyph leads each item, blip trails at the far edge \u2014 the icon says
   WHICH view, the blip says which one you are on, so they must not sit together. */
.nav-icon { width: 18px; height: 18px; flex: none; opacity: .68; }
.nav-item:hover .nav-icon, .nav-item.active .nav-icon { opacity: 1; }
.nav-item .nav-blip { margin-left: auto; }
/* Confirms the selection once per nav switch (renderNav recreates this node on
   every applyView) rather than pulsing forever \u2014 a live-status dot that never
   stopped blinking read as broken, not alive. */
.nav-blip { width: 6px; height: 6px; border-radius: var(--radius-pill); background: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent);
  animation: blip-in var(--dur-5) var(--ease-out-expo) both; }
@keyframes blip-in { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
/* Two states of one element, no JS class toggle: empty it is the decorative rule at
   the foot of the rail; renderShellIdentity (codegen.app.ts) replaces its children
   with the signed-in badge, and a 2px-tall bar clipped that badge to nothing. */
.rail-foot { margin-top: auto; }
.rail-foot:empty { height: 2px; border-radius: 2px;
  background: repeating-linear-gradient(90deg, var(--accent) 0 18px, transparent 18px 30px); opacity: .6; }
.rail-foot:not(:empty) { display: flex; align-items: center; padding-right: var(--space-2); }
main { overflow-y: auto; padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }
/* Every child keeps its content height. main is a fixed-height flex column, and a
   flex item whose overflow is not visible gets an automatic minimum size of ZERO
   (CSS Sizing 3), so .hero -- which clips its own aura with overflow:hidden -- was
   squeezed to a third of its height and cut the masthead through the glyphs. The
   scroll belongs to main, never to a shrunken child. */
main > * { flex: none; }
/* The hero band. The brand's own colour drifts behind the title as a live aurora
   and the mark tilts in real 3D toward the pointer \u2014 depth the product earns from
   its identity, not a decorative gradient bolted on. Pure tokens, so every brand
   gets its own version of it. --px/--py are set by the pointer (see the script). */
.hero { position: relative; isolation: isolate; overflow: hidden; --px: 0; --py: 0;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
  padding: var(--space-4) var(--space-5); box-shadow: var(--shadow); }
/* The aura's motion is the pointer, not a clock: an autonomous infinite drift
   read as background noise and never settled. --px/--py (set by the
   pointermove listener in the script) are the only thing that moves it now;
   the one-shot aura-in just lets it arrive instead of popping in at full
   strength on first paint. */
.hero-aura { position: absolute; inset: -45%; z-index: -1; opacity: .55; pointer-events: none;
  background:
    radial-gradient(38% 54% at calc(26% + var(--px) * 70px) calc(28% + var(--py) * 46px),
      color-mix(in srgb, var(--accent) 58%, transparent), transparent 70%),
    radial-gradient(34% 46% at calc(78% - var(--px) * 56px) calc(74% - var(--py) * 40px),
      color-mix(in srgb, var(--accent) 26%, transparent), transparent 72%);
  animation: aura-in 1.1s var(--ease-out-expo) both; }
@keyframes aura-in { from { opacity: 0; transform: scale(.94); } to { opacity: .55; transform: scale(1); } }
.hero-head { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--space-4); }
.hero-id { display: flex; align-items: center; gap: var(--space-3); min-width: 0; }
.hero-mark { width: 46px; height: 46px; flex: none; border-radius: 14px; overflow: hidden;
  box-shadow: 0 12px 34px color-mix(in srgb, var(--accent) 38%, transparent);
  transform: perspective(600px) rotateY(calc(var(--px) * 20deg)) rotateX(calc(var(--py) * -20deg));
  transition: transform var(--dur-2) var(--ease-out-quart); }
.hero-mark svg { width: 100%; height: 100%; display: block; }
/* ---- The lead hero -------------------------------------------------------
   Every view's header is the same node; only the surface the app LANDS on gets
   the full composition (.hero-lead, toggled in applyView). Three stacked planes
   inside .hero's own isolation, so this is depth the browser composites, not a
   gradient pretending: an accent field, a ground plane raked back in Z, and the
   product's own figure standing in front of both under a real perspective.
   Specificity is (0,1,1) on purpose -- the archetype sheet's .hero rules are
   (0,1,0) and one of them makes the header position:sticky, which a 300px
   masthead must not be. Same precedent as body.dom-x. */

  place-items: center; font-family: var(--font-display); font-weight: 700; font-size: var(--text-sm);
  color: var(--ink); background: var(--accent-soft); }
.dir-id { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.dir-name { font-weight: 650; letter-spacing: -0.01em; }
.dir-meta { display: flex; flex-wrap: wrap; gap: 2px var(--space-3);
  color: var(--ink-2); font-size: var(--text-sm); }
.dir-end { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-2); }
/* Under 560px the third column starves the name: state and actions stack instead. */
@media (max-width: 560px) {
  .dir-end { flex-direction: column; align-items: flex-end; gap: var(--space-1); }
}
/* A frame grid: every cell and card is drawn and nothing floats, so the page reads
   as an instrument rather than a feed. */
.card { box-shadow: none; border: 1px solid var(--line); }
th, td { border-right: 1px solid var(--line); }
th:last-child, td:last-child { border-right: 0; }
.rc.clickable:hover { transform: none; box-shadow: none; border-color: var(--accent); }
.board-col { background: var(--surface); }
.pill { border-radius: var(--radius-sm); }
body { line-height: 1.6; }
th, td { padding: calc(var(--row-y) * 1.18) var(--space-4); }
.panel-head { padding: var(--space-4); }
.panel-title { font-size: var(--text-md); }
.kpi-value { font-size: var(--text-xl); }
.skel-row { padding: calc(var(--row-y) * 1.18) var(--space-4); }
@media (max-width: 760px) {
  :root { --pad-x: var(--space-3); }
  main { padding: 0 var(--pad-x) var(--space-4); }
  #view-title { font-size: clamp(1.3rem, 1rem + 2vw, 1.85rem); }
  .kpis { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  .board-col { flex-basis: 84vw; }
}</style>

// entity that points at nothing is what the work is done AGAINST (a customer, a
// depot, a tariff). Nothing to split on \u2014 under six views, or every entity on one
// side of the graph \u2014 keeps the flat list rather than shipping a heading with one

      el("span", { className: "nav-blip", hidden: !active }),
    ]);
    b.setAttribute("aria-current", active ? "page" : "false");
    b.onclick = () => selectView(v);
    return b;
  };
  for (const [label, views] of navGroups()) {
    // Flat DOM, not a wrapper per group: #nav is the flex column (and a flex ROW
    // under shell-topbar), and a wrapper would take the gap with it.
    if (label) nav.append(el("div", { className: "rail-label", textContent: label }));
    for (const v of views) nav.append(item(v));
  }
  nav.append(item(SETTINGS_VIEW));
}

// The signed-in identity belongs in the shell, but ".rail-foot" is display:none
// under shell-topbar (layout.ts hides the whole rail label/foot cluster there) \u2014
// so topbar rides the same horizontal flex row as #nav instead of writing into
// an element the archetype's own CSS just hid.
function renderShellIdentity() {
  if (!ME) return;
  const badge = el("div", { className: "identity-badge" }, [
    el("span", { textContent: ME.name || ME.email }),
    el("span", { textContent: " \u00B7 " + ME.role }),
  ]);
  if (LAYOUT.shell === "topbar") {
    const nav = $("#nav");
    if (nav) nav.insertAdjacentElement("afterend", badge);
  } else {
    const foot = $(".rail-foot");
    if (foot) { foot.removeAttribute("aria-hidden"); foot.replaceChildren(badge); }
  }
}

// The settings surface: signed-in identity, tenant, real preferences (density
// override, default landing view \u2014 both actually applied, nothing decorative),
// and sign-out. Not a SCHEMA view \u2014 routed through the SETTINGS_VIEW sentinel
// so the existing hash/back-button plumbing (viewOf/applyView) needs no forking.
function renderSettings() {
  const card = el("div", { className: "card panel" });
  const dl = el("dl", { className: "detail" });
  dl.append(el("dt", { textContent: "Name" }), el("dd", { textContent: (ME && ME.name) || "\u2014" }));
  dl.append(el("dt", { textContent: "Email" }), el("dd", { textContent: (ME && ME.email) || "\u2014" }));
  dl.append(el("dt", { textContent: "Role" }), el("dd", {}, ME ? pill(ME.role) : document.createTextNode("\u2014")));
  dl.append(el("dt", { textContent: "Tenant" }), el("dd", { textContent: (ME && ME.tenant) || TENANT }));

  const prefsForm = el("form", { className: "form" });
  const densityId = "f-pref-density";
  const densitySel = el("select", { id: densityId, name: "density" }, [
    el("option", { value: "", textContent: "Product default (" + LAYOUT.density + ")", selected: !PREFS.density }),
    el("option", { value: "airy", textContent: "Airy", selected: PREFS.density === "airy" }),
    el("option", { value: "tight", textContent: "Tight", selected: PREFS.density === "tight" }),
  ]);
  densitySel.onchange = () => {
    PREFS.density = densitySel.value || undefined;
    savePrefs(PREFS);
    if (PREFS.density) applyDensityOverride(PREFS.density);
    else for (const k in DENSITY_VARS.tight) document.documentElement.style.removeProperty(k);
    toast("Density updated");
  };
  const dvId = "f-pref-default-view";
  const dvSel = el("select", { id: dvId, name: "defaultView" }, [
    el("option", { value: "", textContent: "First entity" + (SCHEMA.views[0] ? " (" + SCHEMA.views[0].title + ")" : ""), selected: !PREFS.defaultView }),
    ...SCHEMA.views.map((v) => el("option", { value: v.name, textContent: v.title, selected: PREFS.defaultView === v.name })),
  ]);
  dvSel.onchange = () => {
    PREFS.defaultView = dvSel.value || undefined;
    savePrefs(PREFS);
    toast("Default view updated");
  };
  prefsForm.append(
    el("div", { className: "field" }, [el("label", { htmlFor: densityId, textContent: "Density" }), densitySel]),
    el("div", { className: "field" }, [el("label", { htmlFor: dvId, textContent: "Default view on sign-in" }), dvSel]),
  );

  // ponytail: no dedicated logout route in the fixed auth contract (only
  // GET /api/auth/me is guaranteed) \u2014 best-effort POST, ignored if absent, then
  // a hard redirect always lands back on the login page either way.
  const signOut = el("button", { className: "btn btn-danger", type: "button", textContent: "Sign out" });
  signOut.onclick = async () => {
    signOut.disabled = true; signOut.textContent = "Signing out\u2026";
    try { await api("/api/auth/logout", { method: "POST" }); } catch (e) { /* best-effort */ }
    location.href = "/login.html";
  };

  card.append(
    el("h2", { className: "panel-title", textContent: "Account" }), dl,
    el("h2", { className: "panel-title", textContent: "Preferences" }), prefsForm,
    el("h2", { className: "panel-title", textContent: "Session" }), signOut,
  );
  // Identity, preferences and session are why a person opens this screen, so they
  // lead everywhere. What follows is ordered by what the product is JUDGED on: a
  // ledger is judged on whether the history is trustworthy, a pipeline on whether the
  // work is moving, a register and a schedule on who is in here and what they can do.
  // Files sit last except where they are nobody's headline anyway \u2014 they are the only
  // panel everyone can see, so they are the only one that must never lead the tail.
  const OPS_ORDER = {
    ledger: ["audit", "team", "jobs", "files"],
    pipeline: ["jobs", "audit", "team", "files"],
    register: ["team", "audit", "jobs", "files"],
    schedule: ["team", "jobs", "audit", "files"],
  };
  // [heading, render, admin-only]. Files are for everyone: GET /api/uploads is open
  // to every authenticated role (the server only narrows the WRITE verbs). The other
  // three would 403 on every request for anyone else, so a non-admin is not shown a
  // panel they cannot use \u2014 the same rule, and the same ADMIN_ROLES check, the three
  // servers enforce. One table, one gate: reordering can no longer leak a panel.
  const OPS_PANELS = {
    files: ["Files", renderFiles, false],
    team: ["Team", renderTeam, true],
    jobs: ["Background jobs", renderJobs, true],
    audit: ["Audit trail", renderAudit, true],
  };
  for (const key of OPS_ORDER[LAYOUT.character] || OPS_ORDER.ledger) {
    const p = OPS_PANELS[key];
    if (p[2] && !canRestore()) continue;
    card.append(el("h2", { className: "panel-title", textContent: p[0] }), p[1]());
  }
  $("#content").replaceChildren(card);
}

// Who else is in this workspace, and how a second person gets in at all.
//
// The server has shipped GET /api/users, POST /api/users/:id/role and
// POST /api/users/invite since the first build, and nothing ever called them. The
// consequence was not a missing settings tab: signup with no invite mints a BRAND
// NEW tenant, and an invite token can only come from that unreachable endpoint \u2014 so
// every generated app was single-user in practice, and a colleague who signed up
// landed in an empty parallel workspace with no way to discover why.
function renderTeam() {
  const box = el("div", { className: "children", textContent: "Loading\u2026" });
  box.setAttribute("aria-busy", "true");
  const wrap = el("div", {});
  // The token is returned ONCE (only its hash is stored), so it goes into a
  // readonly, labelled, selectable input \u2014 not a toast that expires in 2.4s and
  // takes the only copy of the link with it.
  const linkBox = el("div", { className: "field", hidden: true });
  const linkId = "f-invite-link";
  const linkInput = el("input", { id: linkId, className: "search", readOnly: true, type: "text" });
  const copy = el("button", { className: "btn btn-sm", type: "button", textContent: "Copy link" });
  copy.onclick = async () => {
    try { await navigator.clipboard.writeText(linkInput.value); toast("Invite link copied"); }
    catch (e) { linkInput.select(); toast("Press Ctrl/Cmd+C to copy", "err"); }
  };
  linkBox.append(
    el("label", { htmlFor: linkId, textContent: "Invite link \u2014 copy it now, it is shown once" }),
    linkInput, copy,
  );

  const invite = el("button", { className: "btn btn-sm", type: "button", textContent: "Invite a teammate" });
  invite.onclick = async () => {
    invite.disabled = true;
    try {
      const res = await api("/api/users/invite", { method: "POST" });
      linkInput.value = location.origin + "/login.html?invite=" + encodeURIComponent(res.invite);
      linkBox.hidden = false;
      linkInput.focus();
      linkInput.select();
    } catch (e) { if (!isAuthLoss(e)) toast(String(e.message || e), "err"); }
    invite.disabled = false;
  };

  const fill = () => api("/api/users").then((data) => {
    const users = rowsOf(data);
    box.removeAttribute("aria-busy");
    box.replaceChildren(...users.map((u) => {
      const row = el("div", { className: "child-row" }, [el("span", { textContent: u.email })]);
      const self = !!ME && u.id === ME.id;
      // The server refuses self-demotion and the last admin's demotion, both to stop
      // a one-request lockout. Disabling self here means the reachable control and
      // the enforced rule agree instead of handing back a 400 the user can't act on.
      const sel = el("select", {
        disabled: self,
        title: self ? "You cannot change your own role" : "",
      }, SCHEMA.roles.map((r) => el("option", { value: r, textContent: r, selected: r === u.role })));
      sel.setAttribute("aria-label", "Role for " + u.email);
      sel.onchange = async () => {
        const prev = u.role;
        sel.disabled = true;
        try {
          await api("/api/users/" + u.id + "/role", {
            method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ role: sel.value }),
          });
          u.role = sel.value;
          toast(u.email + " is now " + sel.value);
        } catch (e) {
          sel.value = prev; // the change did not happen; the control must not claim it did
          if (!isAuthLoss(e)) toast(String(e.message || e), "err");
        }
        sel.disabled = false;
      };
      row.append(sel);
      return row;
    }));
    if (!users.length) box.replaceChildren(el("p", { className: "empty-sub", textContent: "Nobody else has joined yet. Send an invite link to add someone." }));
  }).catch((e) => {
    box.removeAttribute("aria-busy");
    if (isAuthLoss(e)) return;
    box.replaceChildren(errorCard("Couldn't load the team", String(e.message || e),
      () => { box.setAttribute("aria-busy", "true"); box.textContent = "Loading\u2026"; fill(); }));
  });
  fill();
  wrap.append(box, el("p", { className: "empty-sub", textContent: "New members join on the lowest role. Promote them here." }), invite, linkBox);
  return wrap;
}

// ---- operator surfaces: the queue, the trail, the files -------------------------
// Three more server surfaces that shipped routed and unreachable. Every admin
// mutation writes an audit line and nothing could read one; every write enqueues a
// job and a stuck one was invisible AND unfixable without SQL; the four uploads
// verbs had no page at all. They live in the settings panel beside Team \u2014 same
// shell, same gating rule, no second navigation concept to learn.

// ISO from the server -> the reader's locale. Anything unparseable prints as-is
// rather than as "Invalid Date".
function whenText(iso) {
  const t = Date.parse(iso);
  return isNaN(t) ? String(iso === null || iso === undefined ? "\u2014" : iso) : new Date(t).toLocaleString();
}
// All three panels are the same shape: a busy region, one fetch, an inline error
// carrying a retry that re-runs THAT fetch. Written once so a panel cannot ship
// with a blank box on failure. run(true) = a background refresh (the jobs pager):
// it leaves the rows on screen alone and reports a failure as a toast, because
// wiping a loaded list to report that its NEXT page failed loses more than it says.
function fillBox(box, label, get, paint) {
  box.setAttribute("aria-label", label);
  const run = (quiet) => {
    if (!quiet) {
      box.setAttribute("aria-busy", "true");
      box.replaceChildren(el("p", { className: "empty-sub", textContent: "Loading\u2026" }));
    }
    return get().then((data) => {
      box.removeAttribute("aria-busy");
      paint(rowsOf(data));
    }).catch((e) => {
      box.removeAttribute("aria-busy");
      if (isAuthLoss(e)) return; // already navigating to /login.html
      if (quiet) { toast(String(e.message || e), "err"); return; }
      box.replaceChildren(errorCard("Couldn't load " + label.toLowerCase(), String(e.message || e), () => run()));
    });
  };
  return run;
}

// The queue, with the two things an operator can DO about it. GET /api/jobs answers
// with a BARE ARRAY of at most JOBS_PAGE rows, newest first, and the next page is
// ?cursor=<the last row's id> \u2014 no envelope, so the cursor is read off the rows.
const JOBS_PAGE = 200; // = the server's own LIMIT in src/handlers/jobs.ts
function renderJobs() {
  const box = el("div", { className: "children" });
  const wrap = el("div", {});
  let cursor = null, appending = false;
  const more = el("button", { className: "btn btn-sm", type: "button", textContent: "Load older jobs", hidden: true });

  // Cancel and requeue both rewrite status, attempts AND last_error server-side, so
  // the answer is re-read rather than guessed at in the browser. Reloading from the
  // top (cursor cleared) is deliberate: a cancelled job's row moves.
  const act = (j, verb, label, ask, danger) => {
    const b = el("button", { className: "btn btn-sm" + (danger ? " btn-danger" : ""), type: "button", textContent: label });
    b.setAttribute("aria-label", label + " job " + j.id + ", " + j.kind);
    b.onclick = async () => {
      if (ask && !confirm(ask)) return;
      b.disabled = true;
      try {
        await api("/api/jobs/" + j.id + "/" + verb, { method: "POST" });
        toast("Job " + j.id + " " + (verb === "cancel" ? "cancelled" : "requeued"));
        reload();
      } catch (e) {
        b.disabled = false;
        if (!isAuthLoss(e)) toast(String(e.message || e), "err");
      }
    };
    return b;
  };
  const jobRow = (j) => {
    const head = el("div", { className: "child-row" }, [
      el("span", {}, [
        pill(j.status),
        document.createTextNode(" " + j.kind + " \u00B7 attempt " + j.attempts + " of " + j.max_attempts + " \u00B7 " + whenText(j.updated_at)),
      ]),
    ]);
    const acts = el("div", { className: "row-actions" });
    // The server only accepts each verb in one state (404 otherwise), so the
    // reachable control and the enforced rule say the same thing.
    if (j.status === "pending" || j.status === "running")
      acts.append(act(j, "cancel", "Cancel", "Cancel job " + j.id + " (" + j.kind + ")? It moves to the dead-letter with the reason recorded, and is not retried.", true));
    if (j.status === "dead") acts.append(act(j, "requeue", "Requeue", null, false));
    head.append(acts);
    // Why it is stuck IS the point of the screen \u2014 never a bare "dead" pill.
    if (!j.last_error) return head;
    return el("div", {}, [head, el("p", { className: "empty-sub", textContent: "Last error: " + j.last_error })]);
  };

  const load = fillBox(box, "Background jobs", () => api("/api/jobs" + (cursor ? "?cursor=" + cursor : "")), (jobs) => {
    const nodes = jobs.map(jobRow);
    if (appending) box.append(...nodes);
    else if (nodes.length) box.replaceChildren(...nodes);
    else box.replaceChildren(el("p", { className: "empty-sub", textContent: "The queue is empty. A job is enqueued whenever a record is created or deleted, and the cron drain runs it out of band \u2014 anything that keeps failing lands here with its error." }));
    if (jobs.length) cursor = jobs[jobs.length - 1].id;
    // A short page is the end of the queue; a full one may have more behind it.
    more.hidden = jobs.length < JOBS_PAGE;
  });
  const reload = () => { cursor = null; appending = false; load(); };
  more.onclick = () => {
    appending = true; more.disabled = true;
    load(true).then(() => { appending = false; more.disabled = false; });
  };
  load();
  wrap.append(box, more);
  return wrap;
}

// The trail, as the compliance artefact it is. GET /api/audit filters on entity,
// action, actor, row and a date range \u2014 every one of them an indexed column \u2014 and
// pages by KEYSET (before=<id>, x-next-cursor back), so the question an auditor
// actually asks ("what did this person do to invoice 4471 last Tuesday") is one
// query and not a scroll through the newest 200 lines hoping it is in there.
const AUDIT_PAGE = 50; // the endpoint clamps per at 500; 50 is a screenful
const AUDIT_ACTIONS = ["create", "update", "delete", "restore", "cancel", "requeue", "revoke"];
function renderAudit() {
  const box = el("div", { className: "children" });
  const wrap = el("div", {});
  const note = el("p", { className: "empty-sub" });
  note.setAttribute("aria-live", "polite"); // a filtered result is announced, not silent
  const more = el("button", { className: "btn btn-sm", type: "button", textContent: "Load older", hidden: true });
  const q = { entity: "", action: "", actor: "", row: "", since: "", until: "" };
  let before = null, appending = false, count = 0;
  const meta = {};

  const auditRow = (a) => el("div", { className: "child-row" }, [
    el("span", { textContent: a.actor_email + " \u00B7 " + humanish(a.action) + " " + humanish(a.entity) + (a.row_id === null || a.row_id === undefined ? "" : " " + a.row_id) }),
    el("span", { className: "count-chip", textContent: whenText(a.at) }),
  ]);
  // Filters go in the QUERY, so they narrow the whole trail and not the page in hand.
  const query = () => {
    const p = new URLSearchParams();
    for (const k of ["entity", "action", "actor", "row"]) if (q[k]) p.set(k, q[k]);
    if (q.since) p.set("since", q.since);
    // at <= until, string compare: the end-of-day suffix keeps the last day INSIDE
    // the range instead of excluding every timestamp on it.
    if (q.until) p.set("until", q.until + "T23:59:59.999Z");
    if (before) p.set("before", String(before));
    p.set("per", String(AUDIT_PAGE));
    return "/api/audit?" + p;
  };
  const filtered = () => Object.keys(q).some((k) => q[k]);
  const load = fillBox(box, "Audit trail", () => api(query(), undefined, meta), (lines) => {
    const nodes = lines.map(auditRow);
    if (appending) { box.append(...nodes); count += lines.length; }
    else {
      count = lines.length;
      if (nodes.length) box.replaceChildren(...nodes);
      else box.replaceChildren(el("p", { className: "empty-sub", textContent: filtered()
        ? "No entries match these filters. Widen the dates, or clear a field."
        : "Nothing recorded yet. Every create, edit, delete, role change and job action writes a line here the moment someone makes one." }));
    }
    // The server hands back a cursor only while the page is FULL, so its absence is
    // the end of the trail \u2014 no empty page fetched to discover that.
    const next = meta.headers.get("X-Next-Cursor");
    before = next || null;
    more.hidden = !next;
    note.textContent = count
      ? count.toLocaleString() + " " + (count === 1 ? "entry" : "entries") + (next ? " so far \u2014 the trail continues." : ". That is every entry matching this filter.")
      : "";
  });
  const reload = () => { before = null; appending = false; load(); };
  more.onclick = () => {
    appending = true; more.disabled = true;
    load(true).then(() => { appending = false; more.disabled = false; });
  };

  const tools = el("div", { className: "panel-tools" });
  const pick = (key, label, opts) => {
    const sel = el("select", { className: "search" }, [el("option", { value: "", textContent: label }),
      ...opts.map((o) => el("option", { value: o[0], textContent: o[1] }))]);
    sel.setAttribute("aria-label", label);
    sel.onchange = () => { q[key] = sel.value; reload(); };
    return sel;
  };
  const typed = (key, label, type) => {
    const i = el("input", { className: "search", type, placeholder: label });
    i.setAttribute("aria-label", label);
    i.onchange = () => { q[key] = i.value; reload(); };
    return i;
  };
  tools.append(
    pick("entity", "Any record type", SCHEMA.views.map((v) => [v.name, v.title])),
    pick("action", "Any action", AUDIT_ACTIONS.map((a) => [a, humanish(a)])),
    typed("row", "Record #", "number"),
    typed("since", "From", "date"),
    typed("until", "To", "date"),
  );
  // The actor list is the same /api/users this screen already reads for the team
  // panel; if it fails, the rest of the filters still work \u2014 one select fewer beats
  // an audit screen that won't render.
  const actor = pick("actor", "Anyone", []);
  api("/api/users").then((users) => {
    for (const u of rowsOf(users)) actor.append(el("option", { value: String(u.id), textContent: u.email }));
  }).catch(() => {});
  tools.append(actor);

  load();
  wrap.append(tools, box, note, more);
  return wrap;
}

// Attachments. All four verbs already exist; only the picker is new here, and it is
// what makes the other three reachable \u2014 a list with no way to add a row is a screen
// that is empty for ever. Download is a plain link (the server sends the bytes as an
// attachment with nosniff), so it needs no fetch at all.
const sizeText = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
function renderFiles() {
  const box = el("div", { className: "children" });
  const wrap = el("div", {});
  const fileRow = (u) => {
    const row = el("div", { className: "child-row" }, [
      el("a", { href: "/api/uploads/" + u.id + "?tenant=" + encodeURIComponent(TENANT), textContent: u.filename }),
      el("span", { className: "count-chip", textContent: sizeText(u.size) + " \u00B7 " + whenText(u.created_at) }),
    ]);
    // DELETE is WRITE_ROLES on the server; a viewer is shown no button to 403 on.
    if (!canWrite()) return row;
    const del = el("button", { className: "btn btn-sm btn-danger", type: "button", textContent: "Delete" });
    del.setAttribute("aria-label", "Delete " + u.filename);
    del.onclick = async () => {
      if (!confirm("Delete " + u.filename + "? The file and its bytes are removed for everyone in this workspace.")) return;
      del.disabled = true;
      try { await api("/api/uploads/" + u.id, { method: "DELETE" }); toast(u.filename + " deleted"); load(); }
      catch (e) { del.disabled = false; if (!isAuthLoss(e)) toast(String(e.message || e), "err"); }
    };
    row.append(del);
    return row;
  };
  const load = fillBox(box, "Files", () => api("/api/uploads"), (files) => {
    if (!files.length) {
      box.replaceChildren(el("p", { className: "empty-sub", textContent: "No files yet. Attach one below \u2014 it is stored against this workspace, and only its members can download it." }));
      return;
    }
    box.replaceChildren(...files.map(fileRow));
  });

  load();
  wrap.append(box);
  if (!canWrite()) return wrap; // read-only role: the list, no picker
  const fileId = "f-upload";
  const input = el("input", { id: fileId, name: "file", type: "file" });
  input.onchange = async () => {
    const f = input.files && input.files[0];
    if (!f) return;
    input.disabled = true;
    const body = new FormData();
    body.append("file", f);
    try {
      // No content-type header on purpose: the browser has to set the multipart
      // boundary itself, and naming the type by hand is what breaks that.
      await api("/api/uploads", { method: "POST", body: body });
      toast(f.name + " uploaded");
      load();
    } catch (e) { if (!isAuthLoss(e)) toast(String(e.message || e), "err"); }
    input.value = "";
    input.disabled = false;
  };
  wrap.append(el("div", { className: "field" }, [
    el("label", { htmlFor: fileId, textContent: "Attach a file" }),
    input,
    el("p", { className: "empty-sub", textContent: "Documents, images and spreadsheets. The server states its own size and type limits if one is refused." }),
  ]));
  return wrap;
}

function selectView(v) {
  // The swap is one synchronous DOM mutation, which is exactly what
  // startViewTransition wants: the browser morphs hero + surface between the two
  // states. Without support, the same mutation runs unwrapped.
  if (document.startViewTransition) document.startViewTransition(() => applyView(v));
  else applyView(v);
}

function applyView(v) {
  current = v;
  ui = { ...BLANK_UI };
  // A cursor and a rollup belong to the question that produced them; a new entity is
  // a new question, so both are dropped rather than carried across.
  nextCursor = null; cursorFor = 0; statsKey = null;
  // The view IS an address. Without this the back button left the app on the
  // first press, a reload always dumped you back on entity #1, and "look at the
  // invoices tab" was un-sendable. replaceState on a bare URL so the first view
  // doesn't cost a history entry; pushState after that so back steps views.
  if (location.hash.slice(1) !== v.name)
    history[location.hash ? "pushState" : "replaceState"](null, "", "#" + v.name);
  renderNav();
  $("#view-title").textContent = v.title;
  // The landing surface is the one the app opens on, and it is the only one that
  // earns the full hero composition \u2014 a masthead on every view is a masthead
  // nobody reads. Every other view keeps the header it always had.
  const heroEl = $(".hero");
  if (heroEl) heroEl.classList.toggle("hero-lead", v === SCHEMA.views[0]);
  if (v === SETTINGS_VIEW) {
    $("#view-sub").textContent = (ME && ME.email) || "";
    $("#new-btn").hidden = true;
    renderSettings();
    return;
  }
  $("#view-sub").textContent = "Loading\u2026";
  showSkeleton(v);
  $("#new-btn").hidden = !v.create || !canWrite();
  loadTable(v);
}

// KPI band: the count of the whole matching set (X-Total-Count, exact and free),
// the total of each numeric field (up to three, so the band never wraps or invents
// metrics \u2014 ref columns are ids, summing them is meaningless, excluded), and on a
// workflow entity the size of each declared state. WHICH of those leads is the
// entity's own read: see bandCards.
// A count with no direction is a number, not a signal. When the entity carries a
// date, compare the last 7 days with the 7 before it and say which way it moved \u2014
// but only when this page IS the whole set. A 7/7 window over one page ordered by
// some other column is not a trend, it's a coincidence.
// ponytail: fixed 7/7 windows, and no trend at all once the set is paged. Both want
// the same server aggregate as the sums (a count grouped by day).
function trendSub(v) {
  const f = v.fields.find((x) => x.type === "date");
  if (!f || !wholeSet()) return "Live count";
  const day = 864e5, now = Date.now();
  let recent = 0, prior = 0;
  for (const r of rows) {
    const age = now - Date.parse(r[f.name]);
    if (isNaN(age)) continue;
    if (age >= 0 && age < 7 * day) recent++;
    else if (age >= 7 * day && age < 14 * day) prior++;
  }
  if (!recent && !prior) return "Live count";
  const pct = prior ? Math.round(((recent - prior) / prior) * 100) : 100;
  return "Live count \u00B7 " + (pct >= 0 ? "+" : "") + pct + "% vs prior 7 days";
}
// The whole-set count per DECLARED state \u2014 the one map both the band and the donut
// read, because a card and an arc that counted separately would eventually disagree.
// Declared values first and at zero, so the sequence is the WORKFLOW and not just
// whatever happens to exist; any key the data holds beyond them still lands.
function stateCounts(f) {
  const counts = new Map();
  for (const s of f.values || []) counts.set(s, 0);
  for (const b of stats.mix) { if (b.key != null) counts.set(String(b.key), Number(b.count) || 0); }
  return counts;
}
// WHAT the band leads with is the entity's own read \u2014 the same leadKind() the record
// body orders by, one region up. Every product used to open on the same sentence
// ("N rows", then whatever numeric column was declared first), which is the tell of a
// generated app: a work pipeline is read by where the work is STUCK, a ledger by the
// money, a population by its size. The count is never dropped, only demoted \u2014 it is
// the one figure every entity can answer, and on a pipeline it is also the whole the
// state cards are a partition of, so a row in an undeclared state still lands in it.
function bandCards(v) {
  const count = kpiCard(v.title, total.toLocaleString(), trendSub(v));
  // data-kpi=<field> makes the figure machine-readable \u2014 seeded live-acceptance seeds
  // a known total and asserts this displayed number matches. Which is exactly why an
  // unprovable sum must not print a number here, and why every branch below keeps
  // these cards: a band that reorders itself out of one hangs the acceptance run.
  const sums = v.fields.filter(isNum).slice(0, 3).map((f) => {
    const sum = sumOf(f);
    return kpiCard("Total " + f.label.toLowerCase(),
      sum === null ? "\u2014" : sum.toLocaleString(undefined, { maximumFractionDigits: 2 }),
      sum === null
        ? "Needs a server total across all " + total.toLocaleString() + " rows"
        : "Sum across " + total.toLocaleString() + " rows",
      f.name);
  });
  const lead = leadKind(v), mix = chartPlan(v).mix;
  // No rollup in hand is no claim: an empty stats.mix can't be told apart from a failed
  // one, and a band of zeros over a full entity is a wrong figure this file won't print.
  if (lead === "state" && mix && stats.mix.length)
    return [...[...stateCounts(mix)].map(([s, n]) => kpiCard(pill(s), n.toLocaleString(),
      "of " + total.toLocaleString() + " " + v.title.toLowerCase())), count, ...sums];
  if (lead === "figure" && sums.length) return [...sums, count];
  return [count, ...sums];
}
const renderKpis = (v) => el("div", { className: "kpis" }, bandCards(v));
// A label is a word on most cards and the state itself on a pipeline's \u2014 the same
// pill the board columns and the rows are read by, so the card and the row it counts
// carry one vocabulary instead of two.
const kpiCard = (label, value, sub, key) => {
  const valueEl = el("div", { className: "kpi-value tabular", textContent: value });
  if (key) valueEl.setAttribute("data-kpi", key);
  return el("div", { className: "card kpi" }, [
    typeof label === "string" ? el("div", { className: "kpi-label", textContent: label })
      : el("div", { className: "kpi-label" }, [label]),
    valueEl,
    el("div", { className: "kpi-sub", textContent: sub }),
  ]);
};

// ---- charts: hand-rolled SVG, zero deps. Schema picks the card, the SERVER counts --
// CHART_COLORS is stamped next to SCHEMA/LAYOUT by genPublic \u2014 series colours come
// from the chosen brand palette, not from a fixed rainbow that ignored it.
// Nothing below reduces the rows on screen. Every figure is a GROUP BY over the whole
// filtered tenant set (see fetchChartData), which is the only way a mix or a trend is
// true past one page \u2014 a page's distribution posing as the entity's is a chart that
// renders perfectly and says something false.
// Rest args, not one body: .chart is already a flex column with a gap, so a card that
// carries controls ABOVE its plot gets that gap for free instead of hiding both in a
// bare wrapper div that collapses them together.
const chartCard = (title, ...body) => el("div", { className: "card chart" }, [
  el("div", { className: "chart-title", textContent: title }), ...body,
]);
// The row a chart's own controls sit in \u2014 the same class the panel's tools use, so a
// select in a card is spaced like a select anywhere else. Null when there is nothing
// to choose.
const chartTools = (...controls) => {
  const on = controls.filter(Boolean);
  return on.length ? el("div", { className: "panel-tools" }, on) : null;
};

// Donut of the first enum field's value distribution, with a legend.
// ponytail: counts only \u2014 this one card ignores ui.metric on purpose. A donut is a
// share-of-whole, which needs a non-negative additive measure; a SUM column that can go
// negative draws arcs that overlap and a centre total that contradicts them. Its title
// says "mix" and it means records. Upgrade: switch on the measure once a bucket's sign
// can be proven non-negative (a manifest min-of-zero on the column would do it).
function donutChart(v) {
  const f = v.fields.find((x) => x.type === "enum");
  if (!f || !stats.mix.length) return null;
  const counts = stateCounts(f);
  // Every matching row in the entity, which is what the arcs are slices OF.
  let charted = 0;
  for (const n of counts.values()) charted += n;
  if (!charted) return null;
  const C = 2 * Math.PI * 42;
  const g = svg("g", { transform: "rotate(-90 60 60)" });
  const legend = el("ul", { className: "legend" });
  let off = 0, i = 0;
  for (const [state, n] of counts) {
    const color = CHART_COLORS[i++ % CHART_COLORS.length];
    if (n > 0) {
      const len = (n / charted) * C;
      g.append(svg("circle", { cx: 60, cy: 60, r: 42, fill: "none", stroke: color,
        "stroke-width": 14, "stroke-dasharray": len + " " + (C - len), "stroke-dashoffset": -off }));
      off += len;
    }
    const sw = el("span", { className: "swatch" });
    sw.style.background = color;
    legend.append(el("li", {}, [sw, el("span", { textContent: state }),
      el("span", { className: "legend-n tabular", textContent: String(n) })]));
  }
  const chart = svg("svg", { viewBox: "0 0 120 120", class: "donut", role: "img", "aria-label": f.label + " distribution" }, [
    g, svg("text", { x: 60, y: 60, "text-anchor": "middle", dy: "0.35em", class: "donut-total" }, [document.createTextNode(String(charted))]),
  ]);
  return chartCard(f.label + " mix", el("div", { className: "donut-wrap" }, [chart, legend]));
}

// Bars from [label, value] pairs. Series colour comes from the brand palette and
// the baseline from --line, so the chart re-themes with the page instead of
// carrying a hardcoded green and a near-white rule that vanished in dark mode.
function barsChart(pairs, aria) {
  const max = Math.max(...pairs.map((p) => p[1]));
  const W = 260, H = 96, PAD = 4, bw = (W - PAD * 2) / pairs.length;
  const bars = pairs.map((p, i) => {
    const h = Math.max(2, (p[1] / max) * (H - 10));
    const rect = svg("rect", { x: PAD + i * bw + bw * 0.15, y: H - h, width: bw * 0.7, height: h, rx: 2, fill: CHART_COLORS[0] });
    // fmt, the same formatter every cell and figure in the app goes through \u2014 a
    // hover reading "1234567" next to a table reading "1,234,567" is two apps.
    rect.append(svg("title", {}, [document.createTextNode(p[0] + ": " + fmt(p[1]))]));
    return rect;
  });
  // The plot stretches to the card (preserveAspectRatio none + a fixed CSS height in
  // the stylesheet) instead of scaling uniformly off its width. A uniformly scaled
  // viewBox multiplies EVERYTHING by width/260 -- on a full-width card that was ~3.9x,
  // which rendered a 96-unit plot 372px tall and blew the 9px axis label up to 35px.
  // Rects are axis-aligned so a non-uniform scale costs nothing; the labels are HTML
  // below, where the type scale and the domain skin actually reach them.
  const plot = svg("svg", { viewBox: "0 0 " + W + " " + H, preserveAspectRatio: "none",
    class: "bars", role: "img", "aria-label": aria }, [
    ...bars,
    // Half a unit up, not flush with the box edge: the stroke is non-scaling, so at
    // y = H exactly half of it renders outside the SVG and the baseline reads as 0.5px.
    svg("line", { x1: 0, x2: W, y1: H - 0.5, y2: H - 0.5, stroke: "var(--line)" }),
  ]);
  const box = el("div", { className: "plot" }, [plot, el("div", { className: "axis" }, [
    el("span", { textContent: pairs[0][0] }),
    el("span", { textContent: pairs[pairs.length - 1][0] }),
  ])]);
  // Bucket count is the one thing the stylesheet can't derive: a stretched plot has no
  // intrinsic bar width, so three buckets on a full-width card became three 230px
  // slabs. The sheet caps the plot at a per-bucket width off this (see .bars).
  box.style.setProperty("--n", String(pairs.length));
  return box;
}

// Bar chart of row counts by the first date field's day, last 13 buckets. The counts
// are the server's; only the timestamp -> day rollup happens here (see fetchChartData).
function dateChart(v) {
  const f = v.fields.find((x) => x.type === "date");
  if (!f || !stats.days.length) return null;
  // "How much per day" is the question this card exists for at least as often as "how
  // many", and a sum of per-bucket SUMs is still exact \u2014 so the measure rides here too.
  const m = metricOf(v);
  const byDay = new Map();
  for (const b of stats.days) { if (b.key == null) continue;
    const day = String(b.key).slice(0, 10);
    byDay.set(day, (byDay.get(day) || 0) + bucketVal(b, m)); }
  const days = [...byDay.keys()].sort().slice(-13);
  if (!days.length) return null;
  const title = measureOf(v, m) + " by " + f.label.toLowerCase();
  return chartCard(title, ...[chartTools(metricSelect(v, m)),
    barsChart(days.map((d) => [d, byDay.get(d)]), title)].filter(Boolean));
}

// Entities with numbers but no enum and no date used to ship a KPI band, a table,
// and no visual at all \u2014 the commonest generated product had nothing to look at.
// Rank the top rows by the first numeric field instead: same bars, no new drawing.
// The ranking is ORDER BY at the server (fetchChartData), so these are the biggest
// rows in the ENTITY, not the biggest on the page in hand.
function topChart(v) {
  const f = v.fields.find(isNum);
  if (!f) return null;
  const lf = labelFieldOf(v);
  const pairs = stats.top
    .filter((r) => typeof r[f.name] === "number")
    .map((r) => [String((lf && r[lf.name]) || "#" + r.id).slice(0, 14), r[f.name]]);
  if (pairs.length < 2) return null;
  return chartCard("Top " + v.title.toLowerCase() + " by " + f.label.toLowerCase(),
    barsChart(pairs, "Top " + v.title + " by " + f.label));
}

// The cross-entity picture: counts cut by a column of the entity this one POINTS AT.
// Same bars, same server GROUP BY, no new drawing \u2014 the only new thing is the hop, plus
// a select so the reader chooses which attribute of the parent to cut by (the choices
// come from crossOptions, which mirrors the server's own hop allowlist).
function crossChart(v) {
  const plan = chartPlan(v);
  if (!plan.cross || !stats.cross.length) return null;
  const pairs = stats.cross
    .filter((b) => b.key != null && b.key !== "")
    .map((b) => [String(b.key).slice(0, 14), bucketVal(b, plan.metric)]);
  if (!pairs.length) return null;
  const sel = el("select", { className: "search" }, crossOptions(v).map((o) =>
    el("option", { value: o.by, textContent: o.label, selected: o.by === plan.cross.by })));
  sel.setAttribute("aria-label", "Group " + v.title.toLowerCase() + " by");
  // Same move as stateFilter/sortControl: write the ui field the query is built from,
  // then re-run THE panel's reload. fetchChartData's key changed, so only this rollup
  // is re-asked and the band repaints where it stands.
  sel.onchange = () => { ui.by = sel.value; refreshTable(); };
  // Grouping picker, measure picker, bars. The title is the same sentence the bars
  // carry as their aria-label, and both name the MEASURE \u2014 "Invoices by customer
  // region" over revenue would be worse than the count it replaced.
  const title = measureOf(v, plan.metric) + " by " + plan.cross.label.toLowerCase();
  return chartCard(title, chartTools(sel, metricSelect(v, plan.metric)), barsChart(pairs, title));
}

// WHICH picture leads is the entity's own surface, and the surface was picked from
// the same fields (layout.ts surfaceRankFor): a timeline entity is one whose subject
// IS time, so its trend is the headline and the mix supports it. Everywhere else
// "how many are in each state" is the first question a record list gets asked.
const renderCharts = (v) => {
  const cards = (surfaceOf(v) === "timeline" ? [dateChart(v), donutChart(v)] : [donutChart(v), dateChart(v)]).filter(Boolean);
  // The hop supports the entity's own pictures rather than leading them: "what state
  // are mine in" is still the first question a record list gets asked.
  const cross = crossChart(v);
  if (cross) cards.push(cross);
  if (!cards.length) { const top = topChart(v); if (top) cards.push(top); }
  return cards.length ? el("div", { className: "charts" }, cards) : null;
};

// ---- table: search / sort / pagination, all of it SERVER-SIDE --------------------
// Search is LIKE, sort is ORDER BY, the page is LIMIT/OFFSET \u2014 the client never sees
// a row it isn't showing, so the surface behaves the same at 50 rows and at 5M.
// Export the WHOLE matching set \u2014 search and sort applied \u2014 not the 50 rows the
// window happens to be showing. A CSV named after the entity that silently held one
// page of it is the defect this fixes: the file opens, the columns are right, the
// numbers are wrong, and nothing on screen ever said so. So the button WALKS the
// same query at the server's biggest page instead.
// ponytail: capped at EXPORT_MAX rows / EXPORT_MAX/REF_PER requests, because past
// that a browser loop is the wrong tool (a streaming CSV endpoint is). Hitting the
// cap is SAID OUT LOUD, in the toast and in the filename \u2014 a truncated export that
// admits it is a different thing from one that doesn't.
const EXPORT_MAX = 5000;
async function exportRows(v) {
  if (wholeSet()) return rows;
  const cap = Math.min(total, EXPORT_MAX);
  const out = [];
  let cursor = null;
  for (let p = 1; out.length < cap; p++) {
    const meta = {};
    // Keyset first: seeking past the last id read is O(1), where OFFSET 4800 makes the
    // database count and discard 4800 rows on EVERY step \u2014 the walk gets slower the
    // further it goes, which is precisely backwards for an export. The server hands
    // back X-Next-Cursor only while sort=id, so any other sort keeps the OFFSET walk
    // instead of breaking.
    const q = cursor ? { cursor, per: REF_PER } : { page: p, per: REF_PER };
    const got = rowsOf(await api(listQuery(v, q), undefined, meta));
    if (!got.length) break;
    out.push(...got);
    const nc = meta.headers.get("X-Next-Cursor");
    // A keyset walk that ran out of cursors is FINISHED. Falling back to page p here
    // would restart it at an offset the walk has already been past.
    if (cursor && !nc) break;
    cursor = nc || null;
  }
  return out.slice(0, cap);
}
function exportBtn(v) {
  const btn = el("button", { className: "btn btn-sm", type: "button", textContent: "Export CSV" });
  btn.onclick = async () => {
    btn.disabled = true; btn.textContent = "Exporting\u2026";
    try {
      const all = await exportRows(v);
      const cell = (s) => '"' + String(s == null ? "" : s).replace(/"/g, '""') + '"';
      const lines = [["id", ...v.fields.map((f) => f.label)].map(cell).join(",")];
      for (const r of all)
        lines.push([r.id, ...v.fields.map((f) => (f.ref ? labelOf(f.ref, r[f.name]) : r[f.name]))].map(cell).join(","));
      const short = all.length < total;
      const url = URL.createObjectURL(new Blob([lines.join("\n")], { type: "text/csv" }));
      const a = el("a", { href: url, download: v.name + (short ? "-first-" + all.length : "") + ".csv" });
      a.click();
      URL.revokeObjectURL(url);
      toast(short
        ? "Exported the first " + all.length.toLocaleString() + " of " + total.toLocaleString() + " rows"
        : "Exported " + all.length.toLocaleString() + " " + (all.length === 1 ? "row" : "rows"));
    } catch (err) {
      if (!isAuthLoss(err)) toast(String(err.message || err), "err");
    }
    btn.disabled = false; btn.textContent = "Export CSV";
  };
  return btn;
}

function buildTable(v, slice, rerender) {
  const actions = (v.update || v.del) && canWrite();
  const cols = ["id", ...v.fields.map((f) => f.name)];
  const head = el("tr", {}, [
    ...cols.map((k) => {
      const label = k === "id" ? "ID" : (v.fields.find((f) => f.name === k)?.label ?? k);
      const th = el("th", { className: "sortable", textContent: label + (ui.sort === k ? (ui.dir === 1 ? " \u25B2" : " \u25BC") : "") });
      // cols is id + this entity's own fields \u2014 the server's sort allowlist exactly.
      // A new sort re-orders the WHOLE set, so page 3 of the old order is meaningless.
      th.onclick = () => { ui.dir = ui.sort === k ? -ui.dir : 1; ui.sort = k; ui.page = 1; rerender(); };
      return th;
    }),
    ...(actions ? [el("th", { className: "th-actions", textContent: "" })] : []),
  ]);
  const body = slice.map((row) => {
    const tr = el("tr", {}, [
      ...cols.map((k) => {
        const f = v.fields.find((x) => x.name === k);
        if (!f) return el("td", { textContent: fmt(row[k]), className: "num" }); // id
        const td = el("td", {}, cellNode(f, row[k], v));
        if (isNum(f)) td.className = "num";
        return td;
      }),
      ...(actions ? [rowActions(v, row)] : []),
    ]);
    if (v.get) { tr.className = "clickable"; tr.onclick = () => openDetail(v, row); tr.tabIndex = 0;
      tr.onkeydown = (e) => { if (e.key === "Enter") openDetail(v, row); }; }
    return tr;
  });
  return el("table", {}, [el("thead", {}, head), el("tbody", {}, body)]);
}

// Edit/delete only render when the manifest declared the matching endpoint.
// tag is "td" inside a table row, "div" inside a card \u2014 same buttons either way.
function rowActions(v, row, tag = "td") {
  const td = el(tag, { className: "row-actions" });
  td.onclick = (e) => e.stopPropagation(); // keep the detail drawer closed
  if (v.update) td.append(el("button", { className: "btn btn-sm", type: "button", textContent: "Edit", onclick: () => openForm(v, row) }));
  if (v.del) td.append(el("button", { className: "btn btn-sm btn-danger", type: "button", textContent: "Delete", onclick: () => removeRow(v, row) }));
  return td;
}

// ---- reading order ---------------------------------------------------------------
// Declaration order is the MANIFEST AUTHOR's order, which is nobody's reading order: a
// record body used to open with the raw row id and then whatever column happened to be
// typed first, so a consignment, an appointment and an invoice all read as the same
// undifferentiated flat list. A reader opens a record with ONE question, and the
// entity's own declared shape says which: a thing with a workflow is read for its
// STATE, a thing carrying money or quantity for the FIGURE, a thing on a schedule for
// WHEN. Nothing here is a hash or a clock \u2014 same manifest, same order, every build,
// and two manifests differ because the DATA differs.
const readKind = (f) => isStatusField(f) ? "state" : f.ref ? "link" : isNum(f) ? "figure" : f.type === "date" ? "date" : "detail";
// How a record reads once its lead is out of the way: how it's going, what it is, how
// much, when, what it hangs off.
const READ_TAIL = ["state", "detail", "figure", "date", "link"];
// The surface LAYOUT already chose for this entity IS a statement about how it is
// read \u2014 a board is read by state, an agenda by when, a directory by name \u2014 so the
// body agrees with the surface instead of contradicting it. With no surface opinion,
// the manifest answers: a declared workflow, else money/quantity, else a state.
const LEAD_KIND = { board: "state", timeline: "date", directory: "detail" };
const leadKind = (v) => LEAD_KIND[surfaceOf(v)]
  || (v.workflow ? "state" : v.fields.some(isNum) ? "figure" : v.fields.some(isStatusField) ? "state" : "detail");
// The label field is IDENTITY \u2014 WHICH record this is \u2014 so it leads whatever the
// question is; the card and the directory row already spend it as the title and drop
// it here. Sort is stable, so declaration order is still the tie-break inside a kind.
function readFields(v) {
  const lf = labelFieldOf(v);
  const lead = leadKind(v);
  const order = [lead, ...READ_TAIL.filter((k) => k !== lead)];
  return (lf ? [lf] : []).concat(v.fields.filter((f) => f !== lf)
    .sort((a, b) => order.indexOf(readKind(a)) - order.indexOf(readKind(b))));
}

// Alternate primary surfaces. Which one renders is the archetype's call (LAYOUT,
// from layout.ts): a workflow product reads as a board, a text-only one as cards.
function cardOf(v, row) {
  const lf = labelFieldOf(v);
  const sf = v.fields.find(isStatusField);
  const shown = readFields(v).filter((f) => f !== lf && f !== sf).slice(0, 4);
  const dl = el("dl", { className: "rc-fields" });
  for (const f of shown) dl.append(el("dt", { textContent: f.label }), el("dd", {}, cellNode(f, row[f.name], v)));
  const card = el("article", { className: "card rc" }, [
    el("div", { className: "rc-head" }, [
      el("h3", { className: "rc-title", textContent: lf && row[lf.name] != null ? String(row[lf.name]) : "#" + row.id }),
      ...(sf && row[sf.name] != null ? [pill(row[sf.name])] : []),
    ]),
    ...(shown.length ? [dl] : []),
    ...((v.update || v.del) && canWrite() ? [rowActions(v, row, "div")] : []),
  ]);
  if (v.get) {
    card.className += " clickable";
    card.tabIndex = 0;
    card.onclick = () => openDetail(v, row);
    card.onkeydown = (e) => { if (e.key === "Enter") openDetail(v, row); };
  }
  return card;
}

const buildCards = (v, slice) => el("div", { className: "cards" }, slice.map((row) => cardOf(v, row)));

// The one categorical field a surface is keyed on: the declared workflow field (what
// a board's columns already are), else the first enum. One definition, so the board's
// columns and the filter above them can never end up naming different fields.
const stateFieldOf = (v) => (v.workflow && v.fields.find((f) => f.name === v.workflow.field)) || v.fields.find((f) => f.type === "enum");
// The one date a range filter reads. Same first-date-field rule the timeline and the
// trend chart already use, so the three can't disagree about which date "since" means.
const dateFieldOf = (v) => v.fields.find((f) => f.type === "date");
// "Show me everything for THIS parent" \u2014 the join the composite FKs already enforce,
// made usable. Server-side equality on the ref column, so it filters the ENTITY and
// not the fifty rows that happened to be on screen when it was clicked.
function setRefFilter(v, f, id, label) {
  ui.ref = { field: f.name, id, chip: f.label + ": " + label };
  ui.page = 1;
  refreshTable();
}

// Columns come from the DECLARED states, so a state with no rows still shows as
// an empty column \u2014 the shape of the pipeline is itself the information.
function buildBoard(v, slice) {
  const kf = stateFieldOf(v);
  if (!kf) return buildCards(v, slice);
  const at = (row) => String(row[kf.name] ?? "\u2014");
  const cols = [...(kf.values || [])];
  for (const row of slice) if (!cols.includes(at(row))) cols.push(at(row));
  return el("div", { className: "board" }, cols.map((k) => {
    const mine = slice.filter((r) => at(r) === k);
    return el("div", { className: "board-col" }, [
      el("div", { className: "board-head" }, [pill(k), el("span", { className: "count-chip", textContent: String(mine.length) })]),
      el("div", { className: "board-stack" }, mine.map((row) => cardOf(v, row))),
    ]);
  }));
}

// A schedule's index is WHEN, not the record: rows group under the day they fall on,
// in the order the current sort put them (first appearance wins, so re-sorting
// re-orders the days too). Grouping only \u2014 no invented days between, because an
// empty stretch in a real diary is information and a fabricated one is not.
function buildTimeline(v, slice) {
  const df = v.fields.find((f) => f.type === "date");
  if (!df) return buildCards(v, slice);
  const groups = new Map();
  for (const row of slice) {
    // slice(0, 10) so an ISO timestamp groups by its day; any other string stays
    // whole and groups by itself rather than by its first ten characters being lucky.
    const raw = row[df.name];
    const key = raw == null || raw === "" ? "" : String(raw).slice(0, 10);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(row);
  }
  return el("div", { className: "timeline" }, [...groups].map(([key, mine]) => {
    const t = key ? Date.parse(key) : NaN;
    const when = isNaN(t)
      ? (key || "No " + df.label.toLowerCase())
      : new Date(t).toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
    return el("div", { className: "tl-group" }, [
      el("div", { className: "tl-when" }, [
        el("span", { className: "tl-date", textContent: when }),
        el("span", { className: "count-chip", textContent: String(mine.length) }),
      ]),
      el("div", { className: "tl-rows" }, mine.map((row) => cardOf(v, row))),
    ]);
  }));
}

// People and places are read by NAME: a monogram, the name, one line of locator
// detail, state at the end. Same reads as cardOf (label field, status field, the
// rest as reference) so one record cannot say different things on two surfaces.
function monogram(s) {
  const parts = String(s).trim().split(/[\s_-]+/).filter(Boolean);
  if (!parts.length) return "?";
  return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
}

function buildDirectory(v, slice) {
  const lf = labelFieldOf(v);
  const sf = v.fields.find(isStatusField);
  const meta = readFields(v).filter((f) => f !== lf && f !== sf).slice(0, 3);
  return el("ul", { className: "dir" }, slice.map((row) => {
    const label = lf && row[lf.name] != null ? String(row[lf.name]) : "#" + row.id;
    const mark = el("span", { className: "dir-mono", textContent: monogram(label) });
    mark.setAttribute("aria-hidden", "true"); // decorative: the name is right there
    const li = el("li", { className: "dir-row" }, [
      mark,
      el("div", { className: "dir-id" }, [
        el("span", { className: "dir-name", textContent: label }),
        ...(meta.length ? [el("div", { className: "dir-meta" }, meta.map((f) => el("span", {}, cellNode(f, row[f.name], v))))] : []),
      ]),
      el("div", { className: "dir-end" }, [
        ...(sf && row[sf.name] != null ? [pill(row[sf.name])] : []),
        ...((v.update || v.del) && canWrite() ? [rowActions(v, row, "div")] : []),
      ]),
    ]);
    if (v.get) {
      li.className += " clickable";
      li.tabIndex = 0;
      li.onclick = () => openDetail(v, row);
      li.onkeydown = (e) => { if (e.key === "Enter") openDetail(v, row); };
    }
    return li;
  }));
}

// The surface is per ENTITY, not per app. LAYOUT.surfaces is the map layout.ts
// derived from each entity's own shape; LAYOUT.surface stays the default for a view
// with no entity behind it (settings). One surface for everything is why a freight
// console used to draw invoices, vehicles, depots and drivers as four kanbans.
const BUILDERS = { table: buildTable, cards: buildCards, board: buildBoard, timeline: buildTimeline, directory: buildDirectory };
const surfaceOf = (v) => (LAYOUT.surfaces && LAYOUT.surfaces[v.name]) || LAYOUT.surface;
const builderFor = (v) => BUILDERS[surfaceOf(v)] || buildTable;

async function removeRow(v, row) {
  if (!confirm("Delete " + singular(v).toLowerCase() + " #" + row.id + "?")) return;
  // No optimistic local drop any more: the page is a window on a server-side set, so
  // deleting a row also changes the total, the KPI band and which row moves up into
  // the window. Re-running the query is both simpler and the only correct answer.
  try {
    await api(v.del.path.replace(":id", row.id), { method: v.del.method });
    // The delete is a tombstone, so there IS a way back \u2014 but only if the UI says
    // so. Without this the row is gone from the user's point of view and only an
    // operator with SQL access can undo it, which is worse than a hard delete:
    // it keeps the data and tells the user it's destroyed.
    toast(singular(v) + " deleted", "ok", canRestore() ? { label: "Undo", run: () => restoreRow(v, row) } : undefined);
  } catch (err) {
    toast(String(err.message || err), "err");
  }
  refreshTable();
}

// The restore route is the delete route + "/restore", POST \u2014 derived rather than
// carried in SCHEMA because codegen.ts stamps it from the delete endpoint's own
// path. codegen.softdelete.test.ts pins the two together so a rename on either
// side can't ship an Undo that 404s.
async function restoreRow(v, row) {
  try {
    await api(v.del.path.replace(":id", row.id) + "/restore", { method: "POST" });
    toast(singular(v) + " restored");
  } catch (err) {
    toast(String(err.message || err), "err");
  }
  refreshTable();
}

// ---- first-run onboarding: a short, dismissible, product-specific getting-
// started list derived straight from SCHEMA \u2014 no fake progress bar, just "here
// are the entities worth creating first, parents before the children that ref
// them". Kahn's-algorithm topo sort; a ref cycle (rare) just falls back to
// declaration order for whatever's left instead of dropping views.
const ONBOARD_KEY = "onboarding-dismissed:" + SCHEMA.app;
function onboardingOrder() {
  const creatable = SCHEMA.views.filter((v) => v.create);
  const remaining = new Set(creatable);
  const out = [];
  while (remaining.size) {
    // A view is "ready" once every creatable ref target it depends on is placed.
    const ready = creatable.find((v) => remaining.has(v) &&
      refTargets(v).every((t) => { const tv = viewOf(t); return !tv || !tv.create || out.includes(tv); }));
    const next = ready || [...remaining][0]; // cycle fallback: declaration order
    out.push(next);
    remaining.delete(next);
  }
  return out;
}
function renderOnboarding() {
