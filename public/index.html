  if (localStorage.getItem(ONBOARD_KEY)) return null;
  const steps = onboardingOrder();
  if (!steps.length) return null;
  const dismiss = () => { localStorage.setItem(ONBOARD_KEY, "1"); card.remove(); };
  const list = el("ol", { className: "onboard-steps" }, steps.map((v) => {
    const btn = el("button", { className: "btn btn-sm", type: "button",
      textContent: "Add " + singular(v).toLowerCase(),
      disabled: !canWrite() });
    if (canWrite()) btn.onclick = () => { selectView(v); openForm(v); };
    return el("li", { className: "onboard-step" }, [
      // ponytail: no glyph here \u2014 .onboard-step::before already carries a counter,
      // and this list IS an ordered sequence (topo order over the refs). Two markers
      // on one row is decoration, not information.
      el("span", { textContent: singular(v) + " \u2014 " + (refTargets(v).length ? "links to " + refTargets(v).map((t) => (viewOf(t) || { title: t }).title).join(", ") : "a good first record") }),
      btn,
    ]);
  }));
  const card = el("div", { className: "card onboard" }, [
    el("div", { className: "panel-head" }, [
      el("h2", { className: "panel-title", textContent: "Get started with " + SCHEMA.app }),
      el("button", { className: "btn btn-sm", type: "button", textContent: "Dismiss", onclick: dismiss }),
    ]),
    el("p", { className: "empty-sub", textContent: "Set these up in order \u2014 each later step can reference the ones before it." }),
    list,
  ]);
  return card;
}

let band = { kpis: null, charts: null }; // the two supporting nodes currently mounted
// flow is the archetype dimension that owns WHERE the supporting material sits, and
// until this it only moved CSS \u2014 so every product shipped the same reading order and
// the same tab order below the header. The stylesheet places these three by
// direct-child selector either way; the DOM order is what a screen reader and the Tab
// key actually follow, and it is the document being different rather than skinned.
// ponytail: flow is the ONLY dimension that can reach DOM order from here. edge,
// radius, density and motion are how a boundary is drawn, how round it is, its rhythm
// and its durations \u2014 properties of a node, not a place for one. They stay CSS.
function contentOrder(v, panel) {
  band = { kpis: renderKpis(v), charts: renderCharts(v) };
  return (LAYOUT.flow === "rail" ? [panel, band.kpis, band.charts]
    : LAYOUT.flow === "strip" ? [band.kpis, panel, band.charts]
      : [band.kpis, band.charts, panel]).filter(Boolean);
}
// The band describes the CURRENT result set, search included, so it repaints whenever
// the query changes. It can't be wrapped in a container to make that one call:
// layout.ts places .kpis and .charts with DIRECT-CHILD selectors (#content > .kpis),
// and a wrapper would silently drop every archetype's placement. Under strip the two
// are not even adjacent, so each node is swapped where it stands \u2014 which also leaves
// the panel, and the search box you are typing in, untouched.
function paintBand(v) {
  if (!band.kpis || !band.kpis.parentNode) return; // not mounted yet \u2014 loadTable is about to
  const kpis = renderKpis(v);
  band.kpis.replaceWith(kpis);
  const charts = renderCharts(v);
  if (band.charts && charts) band.charts.replaceWith(charts);
  else if (band.charts) band.charts.remove();
  // A filter can turn an unchartable set into a chartable one, so a card that wasn't
  // there lands where this flow says it goes: last under strip, beside the KPIs
  // otherwise. Straight to #content, because the panel is not this function's to hold.
  else if (charts) {
    if (LAYOUT.flow === "strip") $("#content").append(charts);
    else kpis.insertAdjacentElement("afterend", charts);
  }
  band = { kpis, charts };
}

// Sorting for the surfaces that have no column heads to click. buildTable's <th> IS
// the table's sort control, so a board, a card register or a timeline could not be
// re-ordered at all \u2014 on any field, ever \u2014 even though the server allowlists
// ?sort=&dir= and those surfaces page through the SAME query. A second CONTROL, not
// a second sorting mechanism: it writes ui.sort/ui.dir and reloads, exactly as the
// header click does.
function sortControl(v, reload) {
  // id + this entity's own fields = the server's sort allowlist, the same list
  // buildTable's cols are \u2014 so a choice here can't 400 either.
  const opts = [{ name: "id", label: "ID" }, ...v.fields];
  // No id: an entity with a field called "sort" would give the form's own control the
  // same one, and its <label for> would then point at this. aria-label carries it.
  const sel = el("select", { className: "search" },
    opts.map((f) => el("option", { value: f.name, textContent: f.label, selected: ui.sort === f.name })));
  sel.setAttribute("aria-label", "Sort " + v.title.toLowerCase() + " by");
  // A new sort re-orders the WHOLE set, so page 3 of the old order is meaningless.
  sel.onchange = () => { ui.sort = sel.value; ui.page = 1; reload(); };
  const dir = el("button", { className: "btn btn-sm", type: "button" });
  const paintDir = () => {
    dir.textContent = ui.dir === 1 ? "\u25B2 Asc" : "\u25BC Desc";
    // An arrow is not a label: say the state AND what pressing it does.
    dir.setAttribute("aria-label", ui.dir === 1
      ? "Sorted ascending, switch to descending"
      : "Sorted descending, switch to ascending");
  };
  paintDir();
  dir.onclick = () => { ui.dir = -ui.dir; ui.page = 1; paintDir(); reload(); };
  return [sel, dir];
}

// Filter by the entity's own state field \u2014 a column the app already pills, charts and
// (on a board) builds its columns from. The equality goes in the QUERY: the server's
// MATCHABLE allowlist answers it, so "just the overdue ones" narrows the entity, and
// the total, the KPI band, the charts and the pager all move with it.
function stateFilter(v, reload) {
  const f = stateFieldOf(v);
  if (!f || f.type !== "enum" || !(f.values || []).length) return [];
  const sel = el("select", { className: "search" }, [ // id-less for the same reason as sortControl's
    el("option", { value: "", textContent: "All " + f.label.toLowerCase(), selected: !ui.state }),
    ...f.values.map((s) => el("option", { value: s, textContent: s, selected: ui.state === s })),
  ]);
  sel.setAttribute("aria-label", "Filter " + v.title.toLowerCase() + " by " + f.label.toLowerCase());
  sel.onchange = () => { ui.state = sel.value; ui.page = 1; reload(); };
  return [sel];
}

// "Between these two dates", the question every operational record gets asked and no
// generated app could answer. Native date inputs: the platform already ships the
// picker, the locale and the keyboard support (ladder rung 4, no library).
function dateFilter(v, reload) {
  const f = dateFieldOf(v);
  if (!f) return [];
  const box = (key, label) => {
    const i = el("input", { className: "search", type: "date", value: ui[key] });
    i.setAttribute("aria-label", label + " " + f.label.toLowerCase());
    i.onchange = () => { ui[key] = i.value; ui.page = 1; reload(); };
    return i;
  };
  return [box("since", "From"), box("until", "To")];
}

// The record panel's ANATOMY, per entity \u2014 layout.ts derives it from the entity's
// own fields (a workflow gets its states as a rail, a media record loses the title
// it doesn't need). surfaceOf decides how a ROW is drawn; this decides what the
// panel AROUND the rows is made of, which was one identical component everywhere.
const panelPlan = (v) => (LAYOUT.panels && LAYOUT.panels[v.name]) || "head";

// A record with a workflow IS its states, so the vocabulary is spelled out beside
// the rows instead of collapsed into a select that hides it. Same query as
// stateFilter \u2014 this is a different presentation of it, not a second filter.
function facetRail(v, reload) {
  const rail = el("div", { className: "panel-facets" });
  const f = stateFieldOf(v);
  if (!f || f.type !== "enum" || !(f.values || []).length) return [rail, () => {}];
  rail.setAttribute("role", "group");
  rail.setAttribute("aria-label", "Filter " + v.title.toLowerCase() + " by " + f.label.toLowerCase());
  const vals = ["", ...f.values];
  const btns = vals.map((val) => {
    const b = el("button", { className: "facet", type: "button", textContent: val || "All" });
    b.onclick = () => { ui.state = val; ui.page = 1; paint(); reload(); };
    return b;
  });
  // aria-pressed, not a checked radio: these are toggles over one query parameter,
  // and the pressed one has to be announced or the rail is decoration.
  const paint = () => btns.forEach((b, i) => {
    const on = vals[i] === (ui.state || "");
    b.classList.toggle("facet-on", on);
    b.setAttribute("aria-pressed", String(on));
  });
  rail.append(el("span", { className: "facet-label", textContent: f.label }), ...btns);
  paint();
  return [rail, paint];
}

function tablePanel(v) {
  const plan = panelPlan(v);
  const search = el("input", { className: "search", type: "search", placeholder: "Search\u2026", value: ui.q });
  search.setAttribute("aria-label", "Search " + v.title.toLowerCase());
  const countChip = el("span", { className: "count-chip" });
  // Filtering repaints the rows and this number and nothing else \u2014 announce it, or a
  // screen-reader user gets no confirmation that the control did anything at all.
  countChip.setAttribute("aria-live", "polite");
  const wrap = el("div", { className: "table-wrap surface-" + surfaceOf(v) });
  const pager = el("div", { className: "pager" });
  // The drill-in a ref cell sets, and the only way back out of it. Built once and
  // toggled, because the tools row is not rebuilt on every reload.
  const refChip = el("button", { className: "btn btn-sm", type: "button", hidden: true });
  refChip.onclick = () => { ui.ref = null; ui.page = 1; reload(); };
  const tools = el("div", { className: "panel-tools" });
  // The controls read ui to show their own current value, so rebuilding them IS the
  // way to reflect a reset \u2014 no second copy of "what does cleared look like".
  let paintFacets = () => {};
  const buildTools = () => tools.replaceChildren(
    search,
    // The aside plan spells the same states out as a rail; two controls on one
    // query parameter is a control that can disagree with itself.
    ...(plan === "aside" ? [] : stateFilter(v, reload)),
    ...dateFilter(v, reload),
    // The table sorts from its own column heads; every other surface has none, so
    // it gets the select instead of a duplicate control it doesn't need.
    ...(surfaceOf(v) === "table" ? [] : sortControl(v, reload)),
    refChip, countChip, exportBtn(v),
  );
  const clearFilters = () => {
    ui = { ...ui, q: "", state: "", ref: null, since: "", until: "", page: 1 };
    search.value = "";
    buildTools();
    paintFacets();
    reload();
  };
  const paint = () => {
    const pages = Math.max(1, Math.ceil(total / PAGE));
    // Deleting or filtering can strand you past the last page. Clamp and re-query
    // once \u2014 ui.page is then <= pages, so this can't loop.
    if (ui.page > pages) { ui.page = pages; reload(); return; }
    paintBand(v);
    // Every filter is a WHERE now, so TOTAL is the population on screen. No page-local
    // slice to caveat, and no "3 of 50" standing in for "3 of 8,321".
    countChip.textContent = total.toLocaleString() + " " + (total === 1 ? "row" : "rows");
    refChip.hidden = !ui.ref;
    if (ui.ref) refChip.textContent = "\u2715 " + ui.ref.chip;
    // A filtered-to-nothing surface used to render bare column headers \u2014 visually
    // identical to a failed load. Say why it's empty and offer the way out.
    if (!rows.length) {
      const clear = el("button", { className: "btn", type: "button", textContent: "Clear filters" });
      clear.onclick = clearFilters;
      wrap.replaceChildren(el("div", { className: "empty" }, [
        el("p", { className: "empty-title", textContent: "No matches" }),
        el("p", { className: "empty-sub", textContent: "Nothing in " + v.title.toLowerCase()
          + " matches " + (ui.q ? "\u201C" + ui.q + "\u201D" : "these filters") + "." }),
        clear,
      ]));
    } else wrap.replaceChildren(builderFor(v)(v, rows, reload));
    pager.replaceChildren();
    pager.hidden = total <= PAGE;
    if (!pager.hidden) {
      const start = (ui.page - 1) * PAGE + 1;
      pager.append(
        el("button", { className: "btn btn-sm", type: "button", textContent: "Prev", disabled: ui.page <= 1, onclick: () => { ui.page--; reload(); } }),
        el("span", { className: "pager-info", textContent: start + "\u2013" + (start + rows.length - 1) + " of " + total.toLocaleString() }),
        el("button", { className: "btn btn-sm", type: "button", textContent: "Next", disabled: ui.page >= pages, onclick: () => { ui.page++; reload(); } }),
      );
    }
  };
  // Every search keystroke, sort click and page step is a round trip now, so the
  // panel owns a request token: only the newest response may paint. Without it a slow
  // page-1 answer lands after a fast page-2 and the table shows rows the pager denies.
  let seq = 0;
  const reload = async () => {
    const mine = ++seq;
    wrap.setAttribute("aria-busy", "true");
    try {
      await fetchPage(v);
      if (mine === seq) paint();
    } catch (e) {
      if (mine !== seq || isAuthLoss(e)) return; // stale answer, or already leaving for /login.html
      // Keep the panel and the search box: only the rows region reports the failure,
      // and Retry re-runs THIS query rather than reloading the whole view. A failed
      // page must never leave an empty table with no message.
      wrap.replaceChildren(errorCard("Couldn't load " + v.title.toLowerCase(), String(e.message || e), reload));
      pager.hidden = true;
    } finally {
      if (mine === seq) wrap.removeAttribute("aria-busy");
    }
  };
  // ponytail: fixed 250ms debounce \u2014 a keystroke is a LIKE scan now, so typing
  // "invoice" must not be seven of them.
  let typing = null;
  search.oninput = () => {
    clearTimeout(typing);
    typing = setTimeout(() => { ui.q = search.value; ui.page = 1; reload(); }, 250);
  };
  refreshTable = reload;
  buildTools();
  paint();
  const head = () => el("div", { className: "panel-head" }, [
    el("h2", { className: "panel-title", textContent: "All " + v.title.toLowerCase() }),
    tools,
  ]);
  // "bar": a media register is looked at, not read. The hero already named the
  // view, so a second "All <plural>" over a grid of pictures is a title with no
  // job; the controls become the full-width bar the eye skips past.
  if (plan === "bar")
    return el("section", { className: "card panel view-enter" }, [
      el("div", { className: "panel-bar" }, [tools]), wrap, pager,
    ]);
  // "aside": the workflow's own vocabulary standing beside the rows it filters.
  if (plan === "aside") {
    const [facets, repaint] = facetRail(v, reload);
    paintFacets = repaint;
    return el("section", { className: "card panel view-enter" }, [
      head(), el("div", { className: "panel-split" }, [facets, wrap]), pager,
    ]);
  }
  return el("section", { className: "card panel view-enter" }, [head(), wrap, pager]);
}

async function loadTable(v) {
  const c = $("#content");
  band = { kpis: null, charts: null };
  try {
    // Fetch the view's FIRST PAGE and every ref target in parallel \u2014 labels need them.
    await Promise.all([fetchPage(v), ...refTargets(v).map((t) => loadInto(t))]);
    // A fast second nav while this was in flight already owns the surface; painting
    // now would drop this entity's band into that entity's view.
    if (v !== current) return;
    $("#view-sub").textContent = total.toLocaleString() + " " + (total === 1 ? "record" : "records");
    if (!total) {
      c.replaceChildren(...[renderOnboarding(), emptyCard(v)].filter(Boolean));
      return;
    }
    // Panel first, band second: the panel's initial paint has nothing mounted to swap.
    const panel = tablePanel(v);
    c.replaceChildren(...contentOrder(v, panel));
  } catch (e) {
    $("#view-sub").textContent = "";
    if (isAuthLoss(e)) {
      // api() already started the bounce to /login.html; don't flash a scary error
      // card over it, and leave a real link in case the navigation was blocked.
      const gone = errorCard("Session expired", "Taking you back to sign-in\u2026", null);
      gone.append(el("a", { className: "btn", href: "/login.html", textContent: "Go to sign-in" }));
      c.replaceChildren(gone);
      return;
    }
    // Retry is a re-fetch of this view, not a reload of the page: same skeleton,
    // same scroll position, no lost drawer state.
    c.replaceChildren(errorCard("Couldn't load " + v.title.toLowerCase(), String(e.message || e),
      () => { showSkeleton(v); loadTable(v); }));
  } finally {
    c.removeAttribute("aria-busy");
  }
}

function openDetail(v, row) {
  const body = el("div", {});
  const dl = el("dl", { className: "detail" });
  for (const f of readFields(v)) {
    const dd = el("dd", {}, cellNode(f, row[f.name]));
    if (isNum(f)) dd.className = "num";
    dl.append(el("dt", { textContent: f.label }), dd);
  }
  // The id LED this list, which made every product's drawer open on the one fact the
  // drawer title already carries. It stays \u2014 a row id is how you talk to support about
  // a record \u2014 as the reference line at the end.
  dl.append(el("dt", { textContent: "ID" }), el("dd", { textContent: fmt(row.id), className: "num" }));
  body.append(dl);

  // Workflow moves: one button per legal next state from the row's current value.
  // The server is the authority \u2014 an illegal race still 409s and the message shows.
  const wf = v.workflow;
  if (wf && v.update && canWrite()) {
    const nexts = wf.transitions[row[wf.field]] || [];
    if (nexts.length) {
      const acts = el("div", { className: "wf-actions" }, nexts.map((next) =>
        el("button", { className: "btn", type: "button", textContent: "Move to " + next, onclick: async (ev) => {
          ev.target.disabled = true;
          const payload = {};
          payload[wf.field] = next;
          try {
            const updated = await api(v.update.path.replace(":id", row.id), { method: v.update.method,
              headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
            toast(humanish(wf.field) + " \u2192 " + next);
            loadTable(v);
            openDetail(v, updated);
          } catch (err) {
            ev.target.disabled = false;
            toast(String(err.message || err), "err"); // surfaces the 409 allowed-states message
          }
        } })));
      body.append(el("h3", { className: "drawer-sub", textContent: "Workflow" }), acts);
    }
  }

  // Related children: rows of every entity ref'ing this one, filtered to this row.
  for (const rel of childRefs(v)) {
    const box = el("div", { className: "children", textContent: "Loading\u2026" });
    box.setAttribute("aria-busy", "true");
    body.append(el("h3", { className: "drawer-sub", textContent: rel.view.title }), box);
    // Retry just re-runs it \u2014 there is no cache in this path any more, on purpose.
    const fill = () => childrenOf(rel, row.id).then(({ kids, more }) => {
      box.removeAttribute("aria-busy");
      if (!kids.length) {
        box.replaceChildren(el("p", { className: "empty-sub", textContent: "No " + rel.view.title.toLowerCase() + " linked to this " + singular(v).toLowerCase() + " yet." }));
        return;
      }
      const lf = labelFieldOf(rel.view);
      const pf = rel.view.fields.find(isStatusField);
      box.replaceChildren(...kids.map((kid) => {
        const b = el("button", { className: "child-row", type: "button" }, [
          el("span", { textContent: lf && kid[lf.name] != null ? String(kid[lf.name]) : "#" + kid.id }),
          ...(pf && kid[pf.name] != null ? [pill(kid[pf.name])] : []),
        ]);
        b.onclick = () => openDetail(rel.view, kid); // drill into the child's detail
        return b;
      }));
      // A list showing 200 of 900 has to SAY 200 of 900. Truncation the reader can't
      // see is the same defect as the wrong filter, one layer up.
      if (more) box.append(el("p", { className: "empty-sub", textContent: "Showing the first " + kids.length + " of " + more + ". Open " + rel.view.title + " to see them all." }));
    }).catch((e) => {
      box.removeAttribute("aria-busy");
      if (isAuthLoss(e)) return; // already navigating to /login.html
      box.replaceChildren(errorCard("Couldn't load " + rel.view.title.toLowerCase(), String(e.message || e),
        () => { box.replaceChildren(); box.setAttribute("aria-busy", "true"); box.textContent = "Loading\u2026"; fill(); }));
    });
    fill();
  }

  openDrawer(singular(v) + " \u00B7 #" + fmt(row.id), body);
}
const humanish = (s) => s.replace(/[_-]+/g, " ");

// Typed form control per field: enum \u2192 select, bool \u2192 checkbox, date \u2192 date input,
// ref \u2192 select over the target entity's rows (label = first text field, value = id).
function control(f, val) {
  const id = "f-" + f.name;
  if (f.type === "enum")
    return el("select", { id, name: f.name, required: true },
      (f.values || []).map((s) => el("option", { value: s, textContent: s, selected: s === val })));
  if (f.ref && viewOf(f.ref))
    return el("select", { id, name: f.name, required: true },
      (cache.get(f.ref) || []).map((r) => el("option", { value: String(r.id), textContent: labelOf(f.ref, r.id), selected: r.id === val })));
  if (f.type === "bool") {
    const box = el("input", { id, name: f.name, type: "checkbox" });
    box.checked = val === 1;
    return box;
  }
  if (f.type === "date")
    return el("input", { id, name: f.name, required: true, type: "date", value: val != null ? String(val).slice(0, 10) : "" });
  const input = el("input", {
    id, name: f.name, required: true,
    type: f.type === "text" ? "text" : "number",
    step: f.type === "real" ? "any" : "1",
    inputMode: f.type === "text" ? "text" : "numeric",
  });
  if (val !== undefined && val !== null) input.value = String(val);
  return input;
}

// A refused write comes back as ONE sentence \u2014 "amount must be a number",
// "status must be one of open, closed", "due_at is required" (codegen.ts's
// genValidator) \u2014 and it always opens with the offending field's COLUMN NAME. That
// is enough to put the sentence under the input it is about instead of into a 2.4s
// toast, which on a twelve-field form is a message you have to read, translate to a
// control and act on before it vanishes: the user was left guessing which field.
// The column name is then swapped for the label the reader actually sees.
// Anything that does NOT open with a field name \u2014 "invalid body", a 409 workflow
// refusal, a dead wire \u2014 is not about one input, so it stays a toast.
function fieldError(v, msg) {
  const f = v.fields.find((x) => msg.startsWith(x.name + " "));
  return f ? { field: f, text: f.label + msg.slice(f.name.length) } : null;
}

// A record's fields already arrive in kinds \u2014 a ref points somewhere else, a date is
// when, a number is how much, and everything left is what the thing IS. That is also
// the order a person reads a record in, so it is the order the sections come in. No
// taxonomy is invented in the renderer: every field lands in exactly one of these by
// the same test the rest of the script uses (f.ref, f.type, isNum).
// ponytail: four kinds because four kinds is all the manifest KNOWS. A richer
// grouping (a "billing" section, a field's own section name) is a manifest change \u2014
// add a group property to the field there and read it here, never a heuristic over
// field NAMES.
const GROUP_ORDER = ["Details", "Dates", "Figures", "Links"];
const groupKind = (f) => (f.ref ? "Links" : f.type === "date" ? "Dates" : isNum(f) ? "Figures" : "Details");
const formGroups = (v) => GROUP_ORDER
  .map((legend) => ({ legend, fields: v.fields.filter((f) => groupKind(f) === legend) }))
  .filter((g) => g.fields.length);

// Create when row is absent; edit (pre-filled, PATCH/PUT per the manifest) when given.
function openForm(v, row) {
  const editing = !!row;
  // ONE key per opened create form. A double-tap on Create, a retry after a request
  // that timed out mid-flight, or a resubmit after the server rejected a field all
  // carry the same key \u2014 and the server's ledger answers the repeat with the FIRST
  // row instead of making a second one. Only a successful insert is recorded, so a
  // resubmit after a validation error still creates exactly once.
  // randomUUID is secure-context only, so a LAN preview over plain http falls back to
  // getRandomValues \u2014 same entropy, available everywhere, and still not a guess.
  const idemKey = crypto.randomUUID ? crypto.randomUUID()
    : Array.from(crypto.getRandomValues(new Uint8Array(16)), (b) => b.toString(16).padStart(2, "0")).join("");
  const form = el("form", { className: "form" });
  const notes = new Map(); // field name -> { c: its control, note: the line under it }
  const fieldRow = (f) => {
    const c = control(f, row ? row[f.name] : undefined);
    // Built empty and hidden: an aria-describedby pointing at a blank node is read
    // as nothing, and role=alert announces the message the moment it is filled in.
    const note = el("p", { className: "error-sub", id: "f-" + f.name + "-error", hidden: true });
    note.setAttribute("role", "alert");
    notes.set(f.name, { c, note });
    return el("div", { className: "field" }, [
      el("label", { htmlFor: "f-" + f.name, textContent: f.label }), c, note,
    ]);
  };
  // Under six fields IS one scroll, and a heading over a single control is noise \u2014
  // so is a "section" when every field is the same kind. Above that the shape is what
  // the product does with records: a pipeline CAPTURES them, so intake arrives one
  // section at a time; a ledger, register or schedule wants the whole record in front
  // of it at once. Editing is never a wizard either way \u2014 you came back for one field.
  const groups = formGroups(v);
  const mode = v.fields.length < 6 || groups.length < 2 ? "flat"
    : !editing && LAYOUT.character === "pipeline" ? "stepped" : "sectioned";
  const sections = [];
  const stepOf = new Map(); // field name -> index of the section that owns it
  if (mode === "flat") for (const f of v.fields) form.append(fieldRow(f));
  else groups.forEach((g, i) => {
    const hid = "fg-" + v.name + "-" + i;
    // role=group + aria-labelledby is fieldset/legend's semantics without fieldset's
    // layout quirks \u2014 and without a class the stylesheet doesn't have.
    const box = el("div", { className: "form" }, [
      el("h3", { className: "drawer-sub", id: hid, textContent: g.legend }),
      ...g.fields.map(fieldRow),
    ]);
    box.setAttribute("role", "group");
    box.setAttribute("aria-labelledby", hid);
    for (const f of g.fields) stepOf.set(f.name, i);
    sections.push(box);
    form.append(box);
  });
  // The server reports the FIRST violation only, so each submit surfaces the next one
  // \u2014 which is also why the previous one has to be cleared before asking again.
  const clearNotes = () => {
    for (const { c, note } of notes.values()) {
      note.hidden = true;
      note.textContent = "";
      c.removeAttribute("aria-invalid");
      c.removeAttribute("aria-describedby");
    }
  };
  const verb = (editing ? "Save " : "Create ") + singular(v).toLowerCase();
  const submit = el("button", { className: "btn btn-primary", type: "submit", textContent: verb });
  // Non-stepped forms have nothing to guard and nothing to reveal: it is all on screen.
  let stepGuard = () => false; // true = that submit was a step, not a save
  let revealField = () => {};
  if (mode !== "stepped") form.append(submit);
  else {
    const back = el("button", { className: "btn", type: "button", textContent: "Back" });
    const next = el("button", { className: "btn btn-primary", type: "button", textContent: "Next" });
    // Where you are in the walk, announced politely \u2014 a wizard with no position is a
    // form that has stopped answering "how much more of this is there".
    const status = el("p", { className: "empty-sub" });
    status.setAttribute("aria-live", "polite");
    // Native form validation is off for the walk on purpose: a required control on a
    // display:none step cannot be focused, so the browser refuses the submit with
    // nothing visible happening \u2014 the form looks dead. Each step is instead validated
    // by hand on the way OUT of it, which is the same guarantee one step earlier.
    form.noValidate = true;
    const validStep = (i) => groups[i].fields
      .every((f) => { const c = notes.get(f.name).c; return !c.reportValidity || c.reportValidity(); });
    let at = 0;
    const showStep = (i) => {
      at = i;
      // Inline display, not [hidden]: a section IS a .form (display:flex), so the one
      // property that governs whether it is on screen is the one being toggled.
      for (let n = 0; n < sections.length; n++) sections[n].style.display = n === i ? "flex" : "none";
      back.hidden = i === 0;
      next.hidden = i === sections.length - 1;
      submit.hidden = !next.hidden; // only the last step can create the record
      status.textContent = "Step " + (i + 1) + " of " + sections.length + " \u00B7 " + groups[i].legend;
    };
    const focusStep = () => { const c = notes.get(groups[at].fields[0].name).c; if (c.focus) c.focus(); };
    back.onclick = () => { showStep(at - 1); focusStep(); }; // never validate on the way back
    next.onclick = () => { if (validStep(at)) { showStep(at + 1); focusStep(); } };
    stepGuard = () => {
      // Enter inside a text input submits natively. On any step but the last that
      // means "next", not "create" \u2014 a half-filled record must not reach the server.
      if (at < sections.length - 1) { if (validStep(at)) { showStep(at + 1); focusStep(); } return true; }
      return !validStep(at); // earlier steps were validated on the way past them
    };
    revealField = (name) => { if (stepOf.has(name)) { showStep(stepOf.get(name)); } };
    form.append(status, el("div", { className: "wf-actions" }, [back, next, submit]));
    showStep(0);
  }
  form.onsubmit = async (e) => {
    e.preventDefault();
    clearNotes();
    if (stepGuard()) return;
    submit.disabled = true; submit.textContent = "Saving\u2026";
    const payload = {};
    for (const f of v.fields) {
      const c = form.elements[f.name];
      if (f.type === "bool") payload[f.name] = c.checked ? 1 : 0;
      else if (f.type === "text" || f.type === "date" || f.type === "enum") payload[f.name] = c.value;
      else payload[f.name] = Number(c.value);
    }
    try {
      if (editing) await api(v.update.path.replace(":id", row.id), { method: v.update.method, headers: { "content-type": "application/json" }, body: JSON.stringify(payload) });
      else await api(v.create, { method: "POST", headers: { "content-type": "application/json", "idempotency-key": idemKey }, body: JSON.stringify(payload) });
      toast(singular(v) + (editing ? " saved" : " created"));
      closeDrawer();
      loadTable(v);
    } catch (err) {
      const msg = String(err.message || err);
      const bad = fieldError(v, msg);
      const hit = bad && notes.get(bad.field.name);
      if (hit) {
        // A note is useless on a step nobody can see, so the step that OWNS the
        // refused field comes back before the message is written under it.
        revealField(bad.field.name);
        hit.note.textContent = bad.text;
        hit.note.hidden = false;
        hit.c.setAttribute("aria-invalid", "true");
        hit.c.setAttribute("aria-describedby", hit.note.id);
        hit.c.focus(); // the fix starts in the control that was rejected, not at the top
      } else toast(msg, "err");
      submit.disabled = false; submit.textContent = verb;
    }
  };
  openDrawer(editing ? "Edit " + singular(v).toLowerCase() + " \u00B7 #" + row.id : "New " + singular(v).toLowerCase(), form);
}

let lastFocused = null;
function openDrawer(title, node) {
  lastFocused = document.activeElement;
  $("#drawer-title").textContent = title;
  $("#drawer-body").replaceChildren(node);
  $("#drawer").classList.add("open");
  $("#scrim").classList.add("open");
  // Move focus INTO the drawer so screen-reader users land on its content
  // instead of a background row that's now inert behind the scrim.
  const focusable = $("#drawer-body [href], #drawer-body button, #drawer-body input, #drawer-body select, #drawer-body textarea") || $("#drawer-close");
  if (focusable) focusable.focus();
}
function closeDrawer() {
  $("#drawer").classList.remove("open");
  $("#scrim").classList.remove("open");
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
  lastFocused = null;
}

// ---- offline: this app is a live view of a server, so say so when the wire drops.
// A banner, not a toast: a toast expires, the condition doesn't. Announced politely
// (role=status), and it carries the retry so recovery isn't a page reload.
const reloadCurrent = () => { if (current && current !== SETTINGS_VIEW) { showSkeleton(current); loadTable(current); } };
const netBanner = el("div", { className: "card net-banner" }, [
  el("span", { textContent: "You're offline \u2014 showing the data loaded before the connection dropped." }),
]);
netBanner.setAttribute("role", "status");
netBanner.setAttribute("aria-live", "polite");
netBanner.append(el("button", { className: "btn btn-sm", type: "button", textContent: "Retry now", onclick: reloadCurrent }));
// .net-banner in the stylesheet owns everything about how this looks; display is the
// one property that has to stay here, because an inline display is what beats
// [hidden] \u2014 and flipping it off none is also what re-plays the entrance each time.
netBanner.style.display = "none";
$("#content").before(netBanner);
const setOffline = (off) => { netBanner.style.display = off ? "flex" : "none"; };
addEventListener("offline", () => setOffline(true));
addEventListener("online", () => { setOffline(false); toast("Back online"); reloadCurrent(); });
if (!navigator.onLine) setOffline(true);

// ---- cross-entity search --------------------------------------------------------
// GET /api/search has been built and maintained on every write since the first
// build \u2014 an FTS5 virtual table per entity plus three triggers each \u2014 and no page
// ever queried it. The per-view box only filters the tab you are already on, so an
// operator who knew a name but not which entity held it had to guess a tab and
// retype. This is the one control that asks the whole workspace at once.
const searchForm = el("form", { className: "panel-tools" });
const gsId = "f-global-search";
const gsInput = el("input", { id: gsId, className: "search", type: "search", placeholder: "Search everything\u2026" });
gsInput.setAttribute("aria-label", "Search across every record in " + SCHEMA.app);
searchForm.append(gsInput, el("button", { className: "btn btn-sm", type: "submit", textContent: "Search" }));
searchForm.onsubmit = (e) => {
  e.preventDefault();
  const q = gsInput.value.trim();
  if (q) openSearch(q);
};
// Only where there is something to tokenise: the FTS5 schema indexes text and enum
// columns, so a product whose every field is a number or a date has no index and
// GET /api/search always answers []. A box that can only ever say "nothing matched"
// is the same defect one layer along, so it is not rendered at all.
if (SCHEMA.views.some((v) => v.fields.some((f) => f.type === "text" || f.type === "enum")))
  $("#new-btn").insertAdjacentElement("beforebegin", searchForm);

// Results land in the existing drawer, so Escape-to-close, the scrim and
// focus-restore are inherited rather than reinvented.
async function openSearch(q) {
  const box = el("div", { className: "children", textContent: "Searching\u2026" });
  box.setAttribute("aria-busy", "true");
  openDrawer("Results for " + q, box);
  try {
    const hits = rowsOf(await api("/api/search?q=" + encodeURIComponent(q)));
    box.removeAttribute("aria-busy");
    if (!hits.length) {
      box.replaceChildren(el("p", { className: "empty-sub", textContent: "Nothing matched " + q + ". Try fewer words, or a word from the start of a name." }));
      return;
    }
    box.replaceChildren(...hits.map((h) => {
      const v = viewOf(h.entity);
      // A mixed result list is the one place the per-entity glyph earns its keep at
      // reading speed: the shape says which KIND of record this is before the
      // sentence naming it is parsed. Same sheet, same family, no second system.
      const b = el("button", { className: "child-row", type: "button" }, [
        // Only for an entity the sheet actually drew a symbol for \u2014 a hit on
        // something not in SCHEMA.views would reference an id that isn't there and
        // render an empty 18px hole.
        ...(v ? [icon(v.name)] : []),
        el("span", { textContent: (v ? singular(v) : h.entity) + " \u00B7 " + String(h.snippet || "#" + h.id) }),
      ]);
      b.onclick = () => (v ? drillTo(v, h.id) : closeDrawer());
      return b;
    }));
  } catch (e) {
    box.removeAttribute("aria-busy");
    if (isAuthLoss(e)) return;
    box.replaceChildren(errorCard("Search failed", String(e.message || e), () => openSearch(q)));
  }
}
// A hit carries entity + id, which is enough to open the record itself \u2014 anything
// less makes search a lookup table you still have to act on by hand. Ref labels for
// an entity the user has never visited are not in the cache yet, so they are pulled
// before the drawer paints, otherwise every ref cell would read "#id".
async function drillTo(v, id) {
  if (!v.get) return selectView(v); // no by-id endpoint: its list is the closest honest landing
  try {
    const got = await api(v.get.replace(":id", id));
    await Promise.all(refTargets(v).filter((t) => !cache.has(t)).map((t) => loadInto(t)));
    const row = rowsOf(got)[0];
    if (row) openDetail(v, row);
  } catch (e) { if (!isAuthLoss(e)) toast(String(e.message || e), "err"); }
}

$("#new-btn").onclick = () => current?.create && canWrite() && openForm(current);
$("#scrim").onclick = closeDrawer;
$("#drawer-close").onclick = closeDrawer;
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });

renderNav();
// A view name in the fragment wins over "first entity" \u2014 that's what makes a
// shared link land where the sender was. Unknown name falls back, never blanks.
onpopstate = () => {
  const v = viewOf(location.hash.slice(1)) || SCHEMA.views[0];
  if (v && v !== current) { closeDrawer(); applyView(v); }
};
(async () => {
  // Identity resolves before the first view paints so canWrite()/renderShellIdentity
  // are correct from the very first render, not a flash of full access.
  await loadMe();
  renderShellIdentity();
  const startHash = location.hash.slice(1) || PREFS.defaultView || "";
  const startView = viewOf(startHash) || (SCHEMA.views.length ? SCHEMA.views[0] : null);
  if (startView) selectView(startView);
  else $("#content").replaceChildren(el("div", { className: "empty" }, el("p", { className: "empty-title", textContent: "No views defined." })));
})();

// The hero's depth is real: pointer position drives --px/--py, the aura parallaxes
// and the mark tilts on those axes. Pointer-only (a touch drag would fight scroll)
// and off under reduced-motion, where the CSS falls back to the static 0/0 tilt.
const hero = $(".hero");
if (hero && matchMedia("(hover: hover)").matches && !matchMedia("(prefers-reduced-motion: reduce)").matches)
  hero.addEventListener("pointermove", (e) => {
    const b = hero.getBoundingClientRect();
    hero.style.setProperty("--px", ((e.clientX - b.left) / b.width - 0.5).toFixed(3));
    hero.style.setProperty("--py", ((e.clientY - b.top) / b.height - 0.5).toFixed(3));
  });
</script>
</body>
</html>
